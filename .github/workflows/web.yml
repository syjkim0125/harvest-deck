name: Godot Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Initial source import only. Later runs always build checked-in project.godot.
      - name: Import initial v0.6 source snapshot
        if: ${{ hashFiles('project.godot') == '' }}
        shell: bash
        env:
          SOURCE_SNAPSHOT: 
        run: |
          printf '%s' "$SOURCE_SNAPSHOT" | base64 --decode > /tmp/source.zip
          unzip -q /tmp/source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Import Harvest Deck v0.6 Godot source and Web preset"
          git push origin HEAD:main
      - name: Install Godot 4.6.3 and Web templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          unzip -j -q /tmp/templates.tpz 'templates/web*' -d "$HOME/.local/share/godot/export_templates/4.6.3.stable"
      - name: Import and verify
        run: |
          godot --headless --editor --import --quit
          godot --headless --script tests/run.gd
          godot --headless --script tests/feel_replay.gd
          godot --headless --quit-after 120
      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --export-release Web build/web/index.html
          touch build/web/.nojekyll
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
