name: Godot Web
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.3 and Web templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          unzip -j -q /tmp/templates.tpz 'templates/web*' -d "$HOME/.local/share/godot/export_templates/4.6.3.stable"
      - name: Import and verify SF prototype
        run: |
          godot --headless --editor --import --quit
          godot --headless --verbose --script tests/sf_combat.gd
          godot --headless --verbose --script tests/sf_galaxy.gd
          godot --headless --quit-after 120
      - name: Render mobile viewport evidence
        timeout-minutes: 4
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s '-screen 0 1280x1024x24' godot --audio-driver Dummy --rendering-method gl_compatibility --script tests/sf_capture.gd
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-captures
          path: build/captures/*.png
          if-no-files-found: error
      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --export-release Web build/web/index.html
          touch build/web/.nojekyll
          printf '{"commit":"%s","run_id":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > build/web/build-info.json
          test -s build/web/build-info.json
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public build identity
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl -fsS --max-time 15 "https://syjkim0125.github.io/harvest-deck/build-info.json?v=$GITHUB_SHA" -o /tmp/build-info.json && python3 -c 'import json,os; assert json.load(open("/tmp/build-info.json"))["commit"] == os.environ["GITHUB_SHA"]'; then
              cat /tmp/build-info.json
              exit 0
            fi
            sleep 5
          done
          echo "Public build SHA did not match deployed commit"
          exit 1
