roke-dasharray="5 5" fill="#a2c6db" fill-opacity=".1"/><path d="M535 276L555 313L535 305L515 313Z" fill="#a5c6d9"/><path d="M350 267Q435 280 500 300" stroke="#aacfe1" stroke-width="3" stroke-dasharray="6 5" fill="none"/><text x="535" y="353" text-anchor="middle" font-size="14" fill="#c1dce8">Conditional pickup</text><text x="380" y="445" text-anchor="middle" font-size="16" fill="#b4e3c7">Direct return by default; transport / recovery when conditions permit</text><text x="380" y="476" text-anchor="middle" font-size="12" fill="#b4c9bf">Illustrative layout. Landing checks, pickup costs, time and cargo security remain pending.</text></g></svg>