<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img"><title>D49 ship living conditions proposal</title><rect width="760" height="440" rx="16" fill="#192e35"/><g font-family="sans-serif" fill="#e3ece3" text-anchor="middle"><text x="380" y="32" font-size="22" font-weight="bold">A living ship, manageable by its captain</text><text x="380" y="56" font-size="14" fill="#b7ceca">D49 proposal — pending approval</text><rect x="18" y="90" width="230" height="195" rx="12" fill="#30494a" stroke="#8ac3a1"/><circle cx="133" cy="122" r="12" fill="#8ac3a1"/><text x="133" y="161" font-size="15" font-weight="bold" fill="#8ac3a1">Routine voyage</text><text x="133" y="193" font-size="13">Crew manages supplies,</text><text x="133" y="214" font-size="13">maintenance and rest</text><text x="133" y="260" font-size="13">Observe key conditions</text><rect x="264" y="90" width="230" height="195" rx="12" fill="#30494a" stroke="#d4b47e"/><circle cx="379" cy="122" r="12" fill="#d4b47e"/><text x="379" y="161" font-size="15" font-weight="bold" fill="#d4b47e">Long expedition</text><text x="379" y="193" font-size="13">Supplies may run low;</text><text x="379" y="214" font-size="13">plan route or resupply</text><text x="379" y="260" font-size="13">Captain makes a choice</text><rect x="510" y="90" width="230" height="195" rx="12" fill="#30494a" stroke="#c17e73"/><circle cx="625" cy="122" r="12" fill="#c17e73"/><text x="625" y="161" font-size="15" font-weight="bold" fill="#c17e73">Damage / unusual habitat</text><text x="625" y="193" font-size="13">Life support damaged;</text><text x="625" y="214" font-size="13">repair, shelter or retreat</text><text x="625" y="260" font-size="13">Meaningful intervention</text><rect x="78" y="308" width="604" height="58" rx="10" fill="#344e49" stroke="#89b6a1"/><text x="380" y="331" font-size="15">Species needs + actual facilities + autonomous crew</text><text x="380" y="351" font-size="12">Normal care should not require repetitive manual tasks.</text><text x="380" y="396" font-size="12" fill="#b7ceca">Exact resources, thresholds, crisis rules, simulation depth and UI remain pending.</text><text x="380" y="418" font-size="11" fill="#b7ceca">Explanatory diagram, not final gameplay or art.</text></g></svg>