<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" role="img"><title>D30 character creation flow</title><rect width="760" height="490" rx="18" fill="#172c34"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#a6c6bd"/></marker></defs><g font-family="sans-serif" fill="#e5ebdf"><text x="380" y="35" text-anchor="middle" font-size="23" font-weight="bold">Character creation — D30</text><text x="380" y="59" text-anchor="middle" font-size="14" fill="#b8caca">Situational questions recommend, the player decides</text><rect x="24" y="84" width="225" height="299" rx="15" fill="#243e47" stroke="#83b7c6"/><text x="136" y="112" text-anchor="middle" font-size="17" fill="#a8d5df" font-weight="bold">1. Situation</text><text x="136" y="145" text-anchor="middle" font-size="14">An unknown distress signal</text><text x="136" y="165" text-anchor="middle" font-size="13">What would you do?</text><rect x="43" y="183" width="187" height="31" rx="6" fill="#2e464f" stroke="#526e75"/><text x="136" y="203" text-anchor="middle" font-size="13">Rescue</text><rect x="43" y="223" width="187" height="31" rx="6" fill="#355b60" stroke="#9cd3b9"/><text x="136" y="243" text-anchor="middle" font-size="13">Investigate</text><rect x="43" y="263" width="187" height="31" rx="6" fill="#2e464f" stroke="#526e75"/><text x="136" y="283" text-anchor="middle" font-size="13">Prepare</text><rect x="43" y="303" width="187" height="31" rx="6" fill="#2e464f" stroke="#526e75"/><text x="136" y="323" text-anchor="middle" font-size="13">Cooperate</text><path d="M250 230H270" stroke="#a6c6bd" stroke-width="2" marker-end="url(#arr)"/><rect x="272" y="84" width="216" height="299" rx="15" fill="#243e47" stroke="#d2b680"/><text x="380" y="112" text-anchor="middle" font-size="17" fill="#dfc58e" font-weight="bold">2. Recommendation</text><circle cx="380" cy="183" r="34" fill="#d2b680" fill-opacity=".18" stroke="#d2b680"/><path d="M380 158L389 181L380 205L371 181Z" fill="#d2b680"/><text x="380" y="239" text-anchor="middle" font-size="15">Curious explorer</text><text x="380" y="265" text-anchor="middle" font-size="13">Suggested starting direction</text><text x="380" y="293" text-anchor="middle" font-size="13">Explain actual effects</text><text x="380" y="340" text-anchor="middle" font-size="12" fill="#c3d2c6">Example only</text><path d="M489 230H509" stroke="#a6c6bd" stroke-width="2" marker-end="url(#arr)"/><rect x="511" y="84" width="225" height="299" rx="15" fill="#243e47" stroke="#91c8ad"/><text x="623" y="112" text-anchor="middle" font-size="17" fill="#a5dfc2" font-weight="bold">3. Review / edit</text><rect x="530" y="147" width="187" height="43" rx="7" fill="#304b50" stroke="#91c8ad"/><text x="623" y="173" text-anchor="middle" font-size="13">Review starting setup</text><rect x="530" y="205" width="187" height="43" rx="7" fill="#304b50" stroke="#91c8ad"/><text x="623" y="231" text-anchor="middle" font-size="13">Change recommendation</text><rect x="530" y="263" width="187" height="43" rx="7" fill="#304b50" stroke="#91c8ad"/><text x="623" y="289" text-anchor="middle" font-size="13">Confirm and begin</text><text x="623" y="340" text-anchor="middle" font-size="12" fill="#c3d2c6">No permanent career lock</text><text x="380" y="419" text-anchor="middle" font-size="15" fill="#b4e1c8">Question → recommendation → informed choice → start</text><text x="380" y="448" text-anchor="middle" font-size="13">Exact questions, scoring, editable fields and starting benefits remain pending.</text><text x="380" y="471" text-anchor="middle" font-size="12" fill="#b5c8c9">Original explanatory diagram, not final game UI or psychological test.</text></g></svg>