<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" role="img"><title>D29 discovery and exploration rewards</title><rect width="760" height="530" rx="18" fill="#172e2d"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#95c5ad"/></marker></defs><g font-family="sans-serif" fill="#e3ebdf"><text x="380" y="35" text-anchor="middle" font-size="23" font-weight="bold">Discovery creates the next possibility</text><text x="380" y="60" text-anchor="middle" font-size="14" fill="#b5cabe">D29 — rewards beyond currency and equipment</text><rect x="250" y="82" width="260" height="66" rx="11" fill="#2b4d43" stroke="#95c5ad"/><text x="380" y="110" text-anchor="middle" font-size="18" font-weight="bold">Curiosity and discovery</text><text x="380" y="132" text-anchor="middle" font-size="13">A ruin, habitat, signal or encounter</text><path d="M380 148V171H102.5V190" fill="none" stroke="#dfb87d" stroke-width="2"/><rect x="20" y="190" width="165" height="72" rx="9" fill="#2a4141" stroke="#dfb87d"/><text x="102.5" y="218" text-anchor="middle" font-size="16" font-weight="bold" fill="#dfb87d">Resources</text><text x="102.5" y="242" text-anchor="middle" font-size="13">Craft / trade</text><path d="M102.5 262V286H380V310" stroke="#dfb87d" stroke-width="2" fill="none"/><path d="M380 148V171H287.5V190" fill="none" stroke="#95bfda" stroke-width="2"/><rect x="205" y="190" width="165" height="72" rx="9" fill="#2a4141" stroke="#95bfda"/><text x="287.5" y="218" text-anchor="middle" font-size="16" font-weight="bold" fill="#95bfda">Information</text><text x="287.5" y="242" text-anchor="middle" font-size="13">Clues / knowledge</text><path d="M287.5 262V286H380V310" stroke="#95bfda" stroke-width="2" fill="none"/><path d="M380 148V171H472.5V190" fill="none" stroke="#97d1ab" stroke-width="2"/><rect x="390" y="190" width="165" height="72" rx="9" fill="#2a4141" stroke="#97d1ab"/><text x="472.5" y="218" text-anchor="middle" font-size="16" font-weight="bold" fill="#97d1ab">Relationships</text><text x="472.5" y="242" text-anchor="middle" font-size="13">Trust / companions</text><path d="M472.5 262V286H380V310" stroke="#97d1ab" stroke-width="2" fill="none"/><path d="M380 148V171H657.5V190" fill="none" stroke="#bca9d8" stroke-width="2"/><rect x="575" y="190" width="165" height="72" rx="9" fill="#2a4141" stroke="#bca9d8"/><text x="657.5" y="218" text-anchor="middle" font-size="16" font-weight="bold" fill="#bca9d8">World change</text><text x="657.5" y="242" text-anchor="middle" font-size="13">Routes / settlements</text><path d="M657.5 262V286H380V310" stroke="#bca9d8" stroke-width="2" fill="none"/><rect x="228" y="310" width="304" height="70" rx="12" fill="#304a4e" stroke="#98cfb3"/><text x="380" y="339" text-anchor="middle" font-size="19" font-weight="bold" fill="#b6e5c9">New exploration opportunities</text><text x="380" y="362" text-anchor="middle" font-size="13">Access, knowledge, abilities and connections</text><path d="M532 345H728V115H513" fill="none" stroke="#95c5ad" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="380" y="413" text-anchor="middle" font-size="16">Discover → choose → return or act → consequences → discover again</text><text x="380" y="448" text-anchor="middle" font-size="14" fill="#bad1c2">No mandatory reward bundle or fixed progression route.</text><text x="380" y="478" text-anchor="middle" font-size="13" fill="#b4c9bf">Approved principle; reward balance, unlock conditions and UI remain pending.</text><text x="380" y="507" text-anchor="middle" font-size="12" fill="#b4c9bf">Original explanatory diagram, not final game art.</text></g></svg>