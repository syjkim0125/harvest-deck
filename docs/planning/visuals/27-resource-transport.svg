<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img"><title>Resource transport and return — D27</title><rect width="760" height="460" rx="18" fill="#172d30"/><g font-family="sans-serif" fill="#e3ebdf"><text x="380" y="34" text-anchor="middle" font-size="23" font-weight="bold">Resource transport and return — D27</text><text x="380" y="59" text-anchor="middle" font-size="14" fill="#b4cbbf">Convenient everyday gathering; meaningful cargo decisions for important resources</text><rect x="25" y="86" width="335" height="73" rx="10" fill="#263f43" stroke="#91d6b7"/><text x="192.5" y="113" text-anchor="middle" font-size="17" font-weight="bold" fill="#91d6b7">Everyday cargo</text><text x="192.5" y="136" text-anchor="middle" font-size="13">Low inventory friction</text><rect x="400" y="86" width="335" height="73" rx="10" fill="#263f43" stroke="#dfb882"/><text x="567.5" y="113" text-anchor="middle" font-size="17" font-weight="bold" fill="#dfb882">Important cargo</text><text x="567.5" y="136" text-anchor="middle" font-size="13">Space, protection, return choice</text><path d="M192 159V202M567 159V202" stroke="#aac6bd" stroke-width="2"/><rect x="55" y="202" width="275" height="112" rx="12" fill="#344b44" stroke="#91d6b7"/><path d="M151 279V244Q151 222 192 222Q233 222 233 244V279Z" fill="#8ba491" stroke="#cedac9"/><path d="M151 246H233M183 246V274H201V246" fill="none" stroke="#cedac9" stroke-width="2"/><text x="192" y="302" text-anchor="middle" font-size="14">Personal inventory (example)</text><rect x="430" y="202" width="275" height="112" rx="12" fill="#344b44" stroke="#dfb882"/><rect x="465" y="230" width="65" height="48" rx="6" fill="#b89f7b" stroke="#ead9b1"/><path d="M465 244H530M484 230V278M511 230V278" stroke="#dec9a6"/><path d="M543 253H575" stroke="#e2be86" stroke-width="2" stroke-dasharray="5 4"/><path d="M615 218L648 270L628 263L615 278L602 263L582 270Z" fill="#a7c7c9" stroke="#d5e6de"/><text x="567" y="302" text-anchor="middle" font-size="14">Cargo container / ship (example)</text><path d="M567 314V341" stroke="#dfb882" stroke-width="2"/><rect x="400" y="341" width="335" height="72" rx="10" fill="#263f43" stroke="#dfb882"/><text x="567.5" y="368" text-anchor="middle" font-size="17" font-weight="bold" fill="#dfb882">Choose: continue or return</text><text x="567.5" y="391" text-anchor="middle" font-size="13">Carry, store, transport, protect — rules pending</text><text x="192" y="370" text-anchor="middle" font-size="14" fill="#c5dacf">No universal strict weight micromanagement</text><text x="380" y="438" text-anchor="middle" font-size="13" fill="#b4cbbf">Exact capacity, secured-cargo state and loss conditions remain pending.</text></g></svg>