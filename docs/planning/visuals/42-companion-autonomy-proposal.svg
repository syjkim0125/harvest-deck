<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img"><title>D42 companion autonomy and direct commands — approved principle</title><rect width="760" height="420" rx="16" fill="#192e35"/><g font-family="sans-serif" fill="#e3ece3" text-anchor="middle"><text x="380" y="32" font-size="22" font-weight="bold">Autonomous roles + contextual commands</text><text x="380" y="56" font-size="14" fill="#b7ceca">D42 principle approved — illustrative examples</text><rect x="32" y="83" width="320" height="105" rx="12" fill="#30494a" stroke="#8ac3a1"/><text x="192" y="112" font-size="17" font-weight="bold" fill="#8ac3a1">Everyday autonomy</text><text x="192" y="141" font-size="14">Assigned role and priorities</text><text x="192" y="164" font-size="13">Mechanic notices damaged equipment</text><rect x="408" y="83" width="320" height="105" rx="12" fill="#30494a" stroke="#8abbd5"/><text x="568" y="112" font-size="17" font-weight="bold" fill="#8abbd5">Contextual command</text><text x="568" y="141" font-size="14">Captain requests engine repair first</text><text x="568" y="164" font-size="13">Companion considers current situation</text><path d="M192 188V212H380V235M568 188V212H380" fill="none" stroke="#89b6a1" stroke-width="2"/><rect x="170" y="235" width="420" height="72" rx="10" fill="#344e49" stroke="#89b6a1"/><text x="380" y="260" font-size="16" font-weight="bold">Choose action in context</text><text x="380" y="283" font-size="13">Role · capability · command · safety · individual state</text><path d="M380 307V331" stroke="#89b6a1" stroke-width="2"/><text x="380" y="351" font-size="15">Act, communicate difficulty, or resume ordinary tasks</text><text x="380" y="385" font-size="12" fill="#b7ceca">Command precedence, refusal, timing and UI remain pending.</text><text x="380" y="403" font-size="11" fill="#b7ceca">Explanatory diagram, not a final AI algorithm or game screen.</text></g></svg>