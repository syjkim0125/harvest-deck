umstances</text><text x="380" y="285" font-size="13">Accept / decline / continue relationship</text><path d="M380 304V325" stroke="#89b6a1"/><text x="380" y="349" font-size="16">Join voluntarily when both sides agree</text><text x="380" y="386" font-size="12" fill="#b7ceca">Illustrative scenarios; exact terms, trust, restrictions and UI pending.</text></g></svg>