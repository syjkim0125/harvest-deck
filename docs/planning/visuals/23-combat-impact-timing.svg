<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img"><title>D23 differentiated impact and responsive input</title><rect width="780" height="490" rx="16" fill="#172b30"/><g font-family="sans-serif" fill="#edf0e6"><text x="390" y="33" text-anchor="middle" font-size="23" font-weight="bold">Impact follows the actual hit</text><text x="390" y="57" text-anchor="middle" font-size="14" fill="#b7d0c5">Qualitative timing — not frame counts or intensity values</text><rect x="20" y="77" width="119" height="44" rx="6" fill="#8ca79a"/><text x="79" y="104" font-size="14" text-anchor="middle" fill="#183034">Anticipate</text><rect x="144" y="77" width="119" height="44" rx="6" fill="#9dc5af"/><text x="203" y="104" font-size="14" text-anchor="middle" fill="#183034">Accelerate</text><rect x="268" y="77" width="119" height="44" rx="6" fill="#ebc28b"/><text x="327" y="104" font-size="14" text-anchor="middle" fill="#183034">Contact</text><rect x="392" y="77" width="119" height="44" rx="6" fill="#d79681"/><text x="451" y="104" font-size="14" text-anchor="middle" fill="#183034">Hit-stop</text><rect x="516" y="77" width="119" height="44" rx="6" fill="#ada5d0"/><text x="575" y="104" font-size="14" text-anchor="middle" fill="#183034">Reaction</text><rect x="640" y="77" width="119" height="44" rx="6" fill="#88a6b2"/><text x="699" y="104" font-size="14" text-anchor="middle" fill="#183034">Recover</text><g font-size="15"><text x="30" y="159">Light attack</text><path d="M190 185H745" stroke="#79918c" opacity=".4"/><rect x="200" y="179.8" width="51" height="5.2" rx="3" fill="#d9b279" opacity="0.46"/><rect x="267" y="156.4" width="51" height="28.6" rx="3" fill="#d9b279" opacity="0.73"/><rect x="334" y="177.2" width="51" height="7.800000000000001" rx="3" fill="#d9b279" opacity="0.49"/><rect x="401" y="153.8" width="51" height="31.200000000000003" rx="3" fill="#d9b279" opacity="0.76"/><rect x="468" y="177.2" width="51" height="7.800000000000001" rx="3" fill="#d9b279" opacity="0.49"/><rect x="535" y="151.2" width="51" height="33.800000000000004" rx="3" fill="#d9b279" opacity="0.79"/><rect x="602" y="180.84" width="51" height="4.16" rx="3" fill="#d9b279" opacity="0.448"/><rect x="669" y="182.4" width="51" height="2.6" rx="3" fill="#d9b279" opacity="0.43000000000000005"/><text x="30" y="235">Heavy attack</text><path d="M190 261H745" stroke="#79918c" opacity=".4"/><rect x="200" y="258.4" width="51" height="2.6" rx="3" fill="#d9b279" opacity="0.43000000000000005"/><rect x="267" y="255.8" width="51" height="5.2" rx="3" fill="#d9b279" opacity="0.46"/><rect x="334" y="251.64" width="51" height="9.36" rx="3" fill="#d9b279" opacity="0.508"/><rect x="401" y="211.6" width="51" height="49.4" rx="3" fill="#d9b279" opacity="0.9700000000000001"/><rect x="468" y="232.4" width="51" height="28.6" rx="3" fill="#d9b279" opacity="0.73"/><rect x="535" y="250.6" width="51" height="10.4" rx="3" fill="#d9b279" opacity="0.52"/><rect x="602" y="257.88" width="51" height="3.12" rx="3" fill="#d9b279" opacity="0.43600000000000005"/><rect x="669" y="259.44" width="51" height="1.56" rx="3" fill="#d9b279" opacity="0.41800000000000004"/><text x="30" y="311">Ranged attack</text><path d="M190 337H745" stroke="#79918c" opacity=".4"/><rect x="200" y="313.6" width="51" height="23.400000000000002" rx="3" fill="#d9b279" opacity="0.67"/><rect x="267" y="332.84" width="51" height="4.16" rx="3" fill="#d9b279" opacity="0.448"/><rect x="334" y="334.4" width="51" height="2.6" rx="3" fill="#d9b279" opacity="0.43000000000000005"/><rect x="401" y="295.4" width="51" height="41.6" rx="3" fill="#d9b279" opacity="0.88"/><rect x="468" y="324.52" width="51" height="12.48" rx="3" fill="#d9b279" opacity="0.544"/><rect x="535" y="331.8" width="51" height="5.2" rx="3" fill="#d9b279" opacity="0.46"/><rect x="602" y="334.92" width="51" height="2.08" rx="3" fill="#d9b279" opacity="0.42400000000000004"/><rect x="669" y="335.96" width="51" height="1.04" rx="3" fill="#d9b279" opacity="0.41200000000000003"/><