<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img"><title>D21 manual ground controls with assistance</title><rect width="760" height="450" rx="18" fill="#172a30"/><g font-family="sans-serif" fill="#e0eade"><text x="380" y="32" text-anchor="middle" font-weight="bold" font-size="23">Manual ground combat + assistance</text><rect x="35" y="52" width="270" height="353" rx="22" fill="#2d493e" stroke="#91b4a0" stroke-width="2"/><path d="M46 158L290 85M46 242L290 169M46 326L290 253" stroke="#73947e" opacity=".3"/><circle cx="170" cy="210" r="17" fill="#ddc6a3"/><rect x="159" y="224" width="22" height="26" rx="5" fill="#ba8966"/><ellipse cx="236" cy="133" rx="24" ry="17" fill="#ba8c70"/><circle cx="236" cy="133" r="35" fill="none" stroke="#e4bb7c" stroke-width="2" stroke-dasharray="6 5"/><path d="M185 208Q240 216 252 167" stroke="#f4d09b" stroke-width="5" fill="none"/><circle cx="88" cy="344" r="22" fill="#8ed3b4" fill-opacity=".15" stroke="#8ed3b4"/><path d="M88 344L141 300" stroke="#8ed3b4" stroke-width="4" stroke-dasharray="5 5"/><text x="170" y="381" text-anchor="middle" font-size="14">Example only: drag / tap</text><g transform="translate(340 60)"><rect width="385" height="87" rx="10" fill="#203947" stroke="#8ed3b4"/><text x="18" y="28" font-size="18" font-weight="bold" fill="#8ed3b4">Player intent</text><text x="18" y="53" font-size="15">Move, attack, evade by choice</text><text x="18" y="72" font-size="13">No default automatic basic attacks</text><path d="M192 87V108" stroke="#9ab7b0" stroke-width="2"/><rect y="108" width="385" height="87" rx="10" fill="#203947" stroke="#d7b577"/><text x="18" y="136" font-size="18" font-weight="bold" fill="#d7b577">Limited assistance</text><text x="18" y="161" font-size="15">Aim correction / combo timing</text><text x="18" y="180" font-size="13">Preserve target and attack intent</text><path d="M192 195V216" stroke="#9ab7b0" stroke-width="2"/><rect y="216" width="385" height="104" rx="10" fill="#203947" stroke="#b6a5e0"/><text x="18" y="244" font-size="18" font-weight="bold" fill="#b6a5e0">Prototype verification</text><text x="18" y="269" font-size="15">One hand, input conflicts, responsiveness</text><text x="18" y="290" font-size="13">Avoid unintended attacks on neutral beings</text></g><text x="380" y="432" text-anchor="middle" font-size="13" fill="#b4c9ca">D21 approved principle. Gesture mapping, thresholds and HUD remain proposals.</text></g></svg>