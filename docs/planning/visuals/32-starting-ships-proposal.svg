<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img"><title>D32 proposal: three starting hulls</title><rect width="760" height="400" rx="18" fill="#182e35"/><g font-family="sans-serif" fill="#e3ece3"><text x="380" y="32" text-anchor="middle" font-size="22" font-weight="bold">Three starting hulls + limited equipment choice</text><text x="380" y="56" text-anchor="middle" font-size="14" fill="#b7ceca">D32 proposal — not approved / not final ship art</text><rect x="18" y="76" width="232" height="207" rx="11" fill="#29434b" stroke="#94cbd7"/><g transform="translate(134 151)"><path d="M0 -51L14 -9L41 38L13 27L0 45L-13 27L-41 38L-14 -9Z" fill="#94cbd7" fill-opacity=".75" stroke="#94cbd7" stroke-width="2"/><rect x="-9" y="-15" width="18" height="30" rx="5" fill="#1e3841"/><path d="M-8 36V52M8 36V52" stroke="#b1deed" stroke-width="3"/></g><text x="134" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#94cbd7">Fast courier</text><text x="134" y="245" text-anchor="middle" font-size="13">Mobility / evasive travel</text><text x="134" y="263" text-anchor="middle" font-size="12" fill="#bdcfc9">Small cargo</text><rect x="264" y="76" width="232" height="207" rx="11" fill="#29434b" stroke="#a1d4b1"/><g transform="translate(380 151)"><path d="M0 -48L32 -19L35 30L0 44L-35 30L-32 -19Z" fill="#a1d4b1" fill-opacity=".75" stroke="#a1d4b1" stroke-width="2"/><rect x="-9" y="-15" width="18" height="30" rx="5" fill="#1e3841"/><circle cx="26" cy="-2" r="8" fill="none" stroke="#e2f2dc" stroke-width="2"/><circle cx="-26" cy="-2" r="8" fill="none" stroke="#e2f2dc" stroke-width="2"/></g><text x="380" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#a1d4b1">Survey craft</text><text x="380" y="245" text-anchor="middle" font-size="13">Detection / exploration</text><text x="380" y="263" text-anchor="middle" font-size="12" fill="#bdcfc9">Moderate combat</text><rect x="510" y="76" width="232" height="207" rx="11" fill="#29434b" stroke="#e0bb83"/><g transform="translate(626 151)"><path d="M0 -42L34 -23L42 31L23 40L-23 40L-42 31L-34 -23Z" fill="#e0bb83" fill-opacity=".75" stroke="#e0bb83" stroke-width="2"/><rect x="-9" y="-15" width="18" height="30" rx="5" fill="#1e3841"/><rect x="-32" y="2" width="18" height="24" rx="2" fill="#7d806d"/><rect x="14" y="2" width="18" height="24" rx="2" fill="#7d806d"/></g><text x="626" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#e0bb83">Utility hauler</text><text x="626" y="245" text-anchor="middle" font-size="13">Cargo / maintenance</text><text x="626" y="263" text-anchor="middle" font-size="12" fill="#bdcfc9">Less agile</text><rect x="65" y="302" width="630" height="61" rx="9" fill="#334b45" stroke="#91c5ac"/><text x="380" y="326" font-size="15" font-weight="bold" text-anchor="middle">Example loadout choice: scanner / cargo / maneuver assist</text><text x="380" y="348" font-size="13" text-anchor="middle">All hulls retain basic travel, exploration, trade and combat.</text><text x="380" y="383" text-anchor="middle" font-size="12" fill="#b8ceca">Silhouettes and equipment examples only. Exact rules, stats and names pending.</text></g></svg>