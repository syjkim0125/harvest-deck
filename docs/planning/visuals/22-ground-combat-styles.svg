<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 492" role="img"><title>D22 shared actions and differentiated combat styles</title><rect width="760" height="492" rx="18" fill="#142a30"/><g font-family="sans-serif" fill="#e3eadd"><text x="380" y="35" text-anchor="middle" font-weight="bold" font-size="23">Shared basics — distinct combat styles</text><rect x="110" y="57" width="540" height="76" rx="12" fill="#25453e" stroke="#91cfb5" stroke-width="2"/><text x="380" y="84" text-anchor="middle" font-size="19" fill="#a6e5cb">Direct movement + manual attack + evade</text><text x="380" y="110" text-anchor="middle" font-size="14">Common actions, D21 assistance preserved</text><path d="M380 133V157H135V177M380 157H625V177M380 157V177" stroke="#aac1b8" fill="none" stroke-width="2"/><g font-size="15" text-anchor="middle"><rect x="25" y="177" width="220" height="86" rx="10" fill="#233d48" stroke="#9bcfbb"/><text x="135" y="209" fill="#9bcfbb" font-size="17" font-weight="bold">Guard / counter</text><text x="135" y="234" fill="#e0eade" font-size="14">shield, timed response</text><rect x="270" y="177" width="220" height="86" rx="10" fill="#233d48" stroke="#a5bfe8"/><text x="380" y="209" fill="#a5bfe8" font-size="17" font-weight="bold">Agile / combo</text><text x="380" y="234" fill="#e0eade" font-size="14">position, openings</text><rect x="515" y="177" width="220" height="86" rx="10" fill="#233d48" stroke="#d7b17c"/><text x="625" y="209" fill="#d7b17c" font-size="17" font-weight="bold">Heavy / stagger</text><text x="625" y="234" fill="#e0eade" font-size="14">weight, commitment</text><rect x="25" y="290" width="220" height="86" rx="10" fill="#233d48" stroke="#9bcfbb"/><text x="135" y="322" fill="#9bcfbb" font-size="17" font-weight="bold">Ranged</text><text x="135" y="347" fill="#e0eade" font-size="14">distance, line of sight</text><rect x="270" y="290" width="220" height="86" rx="10" fill="#233d48" stroke="#a5bfe8"/><text x="380" y="322" fill="#a5bfe8" font-size="17" font-weight="bold">Technology</text><text x="380" y="347" fill="#e0eade" font-size="14">drones, area control</text><rect x="515" y="290" width="220" height="86" rx="10" fill="#233d48" stroke="#d7b17c"/><text x="625" y="322" fill="#d7b17c" font-size="17" font-weight="bold">Support</text><text x="625" y="347" fill="#e0eade" font-size="14">protect, cooperate</text></g><text x="380" y="409" text-anchor="middle" font-size="16" fill="#d9c79c">Equipment / profession / abilities change available responses</text><text x="380" y="436" text-anchor="middle" font-size="14">No universal extra guard or parry buttons required</text><text x="380" y="470" text-anchor="middle" font-size="12" fill="#a8c1c3">D22 approved principle. Styles are examples, not an approved weapon roster or HUD.</text></g></svg>