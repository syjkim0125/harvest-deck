<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420"><title>D41 companion relationships approved principle</title><rect width="760" height="420" rx="16" fill="#192e35"/><g font-family="sans-serif" text-anchor="middle" fill="#e3ece3"><text x="380" y="32" font-size="22" font-weight="bold">Same event, different companions, different reactions</text><text x="380" y="57" font-size="14" fill="#b7ceca">D41 principle approved — illustrative examples</text><rect x="220" y="78" width="320" height="52" rx="10" fill="#344e49" stroke="#89b6a1"/><text x="380" y="109" font-size="17">A risky, noisy expedition</text><path d="M380 130V148H133V170" fill="none" stroke="#8abbd5"/><rect x="18" y="170" width="230" height="120" rx="10" fill="#30494a" stroke="#8abbd5"/><text x="133" y="197" font-size="16" font-weight="bold" fill="#8abbd5">Cautious mechanic</text><text x="133" y="223" font-size="12">Values safety and promises</text><text x="133" y="250" font-size="12">Worries about ship condition</text><path d="M133 290V310H380V326" stroke="#8abbd5" fill="none"/><path d="M380 130V148H379V170" fill="none" stroke="#d4b47e"/><rect x="264" y="170" width="230" height="120" rx="10" fill="#30494a" stroke="#d4b47e"/><text x="379" y="197" font-size="16" font-weight="bold" fill="#d4b47e">Adventurous pilot</text><text x="379" y="223" font-size="12">Values discovery and autonomy</text><text x="379" y="250" font-size="12">Excited by the challenge</text><path d="M379 290V310H380V326" stroke="#d4b47e" fill="none"/><path d="M380 130V148H625V170" fill="none" stroke="#8ac3a1"/><rect x="510" y="170" width="230" height="120" rx="10" fill="#30494a" stroke="#8ac3a1"/><text x="625" y="197" font-size="16" font-weight="bold" fill="#8ac3a1">Sound-sensitive alien</text><text x="625" y="223" font-size="12">Needs a safe, quiet habitat</text><text x="625" y="250" font-size="12">May become unsettled</text><path d="M625 290V310H380V326" stroke="#8ac3a1" fill="none"/><rect x="115" y="326" width="530" height="49" rx="9" fill="#344e49" stroke="#89b6a1"/><text x="380" y="355" font-size="15">Trust / well-being / personal goals and shared experiences</text><text x="380" y="400" font-size="12" fill="#b7ceca">Candidate states, not fixed meters, formulas or final UI.</text></g></svg>