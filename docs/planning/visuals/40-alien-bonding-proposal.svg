<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420"><title>D40 alien bonding approved principle</title><rect width="760" height="420" rx="16" fill="#192e35"/><g font-family="sans-serif" fill="#e3ece3" text-anchor="middle"><text x="380" y="32" font-size="22" font-weight="bold">Observe, understand, build trust</text><text x="380" y="56" font-size="14" fill="#b7ceca">D40 principle approved — illustrative examples</text><rect x="18" y="80" width="230" height="205" rx="12" fill="#30494a" stroke="#8ac3a1"/><ellipse cx="133" cy="140" rx="36" ry="28" fill="#8ac3a1"/><ellipse cx="110" cy="113" rx="9" ry="20" transform="rotate(-25 110 113)" fill="#8ac3a1"/><ellipse cx="156" cy="113" rx="9" ry="20" transform="rotate(25 156 113)" fill="#8ac3a1"/><circle cx="120" cy="136" r="6" fill="#203838"/><circle cx="146" cy="136" r="6" fill="#203838"/><text x="133" y="195" font-size="16" font-weight="bold" fill="#8ac3a1">Curious creature</text><text x="133" y="225" font-size="13">Keep a safe distance</text><text x="133" y="250" font-size="12">May approach voluntarily</text><path d="M133 285V306H380V326" fill="none" stroke="#8ac3a1"/><rect x="264" y="80" width="230" height="205" rx="12" fill="#30494a" stroke="#8abbd5"/><ellipse cx="379" cy="140" rx="36" ry="28" fill="#8abbd5"/><ellipse cx="356" cy="113" rx="9" ry="20" transform="rotate(-25 356 113)" fill="#8abbd5"/><ellipse cx="402" cy="113" rx="9" ry="20" transform="rotate(25 402 113)" fill="#8abbd5"/><circle cx="366" cy="136" r="6" fill="#203838"/><circle cx="392" cy="136" r="6" fill="#203838"/><text x="379" y="195" font-size="16" font-weight="bold" fill="#8abbd5">Injured creature</text><text x="379" y="225" font-size="13">Provide appropriate care</text><text x="379" y="250" font-size="12">May recover and return</text><path d="M379 285V306H380V326" fill="none" stroke="#8abbd5"/><rect x="510" y="80" width="230" height="205" rx="12" fill="#30494a" stroke="#d4b47e"/><ellipse cx="625" cy="140" rx="48" ry="28" fill="#d4b47e"/><ellipse cx="602" cy="113" rx="9" ry="20" transform="rotate(-25 602 113)" fill="#d4b47e"/><ellipse cx="648" cy="113" rx="9" ry="20" transform="rotate(25 648 113)" fill="#d4b47e"/><circle cx="612" cy="136" r="6" fill="#203838"/><circle cx="638" cy="136" r="6" fill="#203838"/><text x="625" y="195" font-size="16" font-weight="bold" fill="#d4b47e">Wary herd animal</text><text x="625" y="225" font-size="13">Understand habitat</text><text x="625" y="250" font-size="12">May remain with its herd</text><path d="M625 285V306H380V326" fill="none" stroke="#d4b47e"/><rect x="170" y="326" width="420" height="49" rx="9" fill="#344e49" stroke="#89b6a1"/><text x="380" y="355" font-size="16">Voluntary companionship or independent life</text><text x="380" y="401" font-size="12" fill="#b7ceca">Species, rules and final art remain pending. No compulsory sequence.</text></g></svg>