<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350"><rect width="720" height="350" rx="15" fill="#172434"/><g font-family="sans-serif" fill="#edf3f5" text-anchor="middle"><text x="360" y="32" font-size="20">D63 — Card ownership (proposal)</text><rect x="30" y="52" width="660" height="58" rx="9" fill="#355d6e"/><text x="360" y="77" font-size="17">Acquired knowledge / collection record</text><text x="360" y="96" font-size="12">Knowledge can remain even when use is unavailable</text><path d="M360 110v20H185v15m175-15h175v15" stroke="#c5b58e" stroke-width="2" fill="none"/><rect x="30" y="145" width="310" height="106" rx="10" fill="#426e62"/><text x="185" y="175" font-size="16">Reproducible technique</text><text x="185" y="200" font-size="12">Compatible equipment / trained crew</text><text x="185" y="224" font-size="12">Unavailable → restoration possible</text><rect x="380" y="145" width="310" height="106" rx="10" fill="#625482"/><text x="535" y="175" font-size="16">Individual unique ability</text><text x="535" y="200" font-size="12">Specific companion / relationship</text><text x="535" y="224" font-size="12">No automatic copy to a substitute</text><rect x="110" y="270" width="500" height="43" rx="8" fill="#395c64"/><text x="360" y="297" font-size="15">Only eligible cards enter active hand</text><text x="360" y="334" font-size="12">Illustrative only · loss, transfer, conditions and UI unresolved</text></g></svg>
