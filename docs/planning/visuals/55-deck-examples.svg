<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580"><rect width="720" height="580" rx="15" fill="#182535"/><g font-family="sans-serif" fill="#edf3f5" text-anchor="middle"><text x="360" y="30" font-size="19">D55 — 비교 및 성장 연결 (재구성)</text><g><rect x="15" y="52" width="220" height="145" rx="10" fill="#263b4c"/><text x="125" y="78" font-size="16">A. 통합 덱</text><rect x="32" y="97" width="25" height="45" rx="4" fill="#477b67"/><rect x="63" y="97" width="25" height="45" rx="4" fill="#635482"/><rect x="94" y="97" width="25" height="45" rx="4" fill="#477b67"/><rect x="125" y="97" width="25" height="45" rx="4" fill="#635482"/><rect x="156" y="97" width="25" height="45" rx="4" fill="#477b67"/><rect x="187" y="97" width="25" height="45" rx="4" fill="#635482"/><text x="125" y="183" font-size="12">하나의 덱</text></g><g><rect x="250" y="52" width="220" height="145" rx="10" fill="#263b4c"/><text x="360" y="78" font-size="16">B. 독립 덱</text><rect x="267" y="97" width="25" height="45" rx="4" fill="#635482"/><rect x="298" y="97" width="25" height="45" rx="4" fill="#635482"/><rect x="329" y="97" width="25" height="45" rx="4" fill="#635482"/><rect x="360" y="97" width="25" height="45" rx="4" fill="#477b67"/><rect x="391" y="97" width="25" height="45" rx="4" fill="#477b67"/><rect x="422" y="97" width="25" height="45" rx="4" fill="#477b67"/><text x="360" y="183" font-size="12">분리 성장</text></g><g><rect x="485" y="52" width="220" height="145" rx="10" fill="#263b4c"/><text x="595" y="78" font-size="16">C. 공유 성장</text><rect x="502" y="117" width="25" height="45" rx="4" fill="#635482"/><rect x="533" y="117" width="25" height="45" rx="4" fill="#635482"/><rect x="564" y="117" width="25" height="45" rx="4" fill="#635482"/><rect x="595" y="117" width="25" height="45" rx="4" fill="#477b67"/><rect x="626" y="117" width="25" height="45" rx="4" fill="#477b67"/><rect x="657" y="117" width="25" height="45" rx="4" fill="#477b67"/><text x="595" y="105" font-size="12">캐릭터 · 동료 · 발견</text><text x="595" y="183" font-size="12">역할별 덱 ↔ 시너지</text></g><text x="360" y="233" font-size="17">탐험에서 새로운 전술까지</text><rect x="20" y="253" width="155" height="48" rx="8" fill="#3e6570"/><text x="97" y="282" font-size="13">외계 기술 발견</text><text x="185" y="282">→</text><rect x="195" y="253" width="155" height="48" rx="8" fill="#3e6570"/><text x="272" y="282" font-size="13">동료 연구</text><text x="360" y="282">→</text><rect x="370" y="253" width="155" height="48" rx="8" fill="#3e6570"/><text x="447" y="282" font-size="13">카드 획득 기회</text><text x="535" y="282">→</text><rect x="545" y="253" width="155" height="48" rx="8" fill="#3e6570"/><text x="622" y="282" font-size="13">실시간 전술</text><circle cx="360" cy="438" r="95" stroke="#6c8a98" stroke-width="2" stroke-dasharray="5 5" fill="none"/><circle cx="360" cy="345" r="37" fill="#526c79"/><text x="360" y="349" font-size="13">탐험</text><circle cx="490" cy="438" r="37" fill="#526c79"/><text x="490" y="442" font-size="13">연구</text><circle cx="360" cy="531" r="37" fill="#526c79"/><text x="360" y="535" font-size="13">제작·성장</text><circle cx="230" cy="438" r="37" fill="#526c79"/><text x="230" y="442" font-size="13">전투·활용</text><text x="360" y="434" font-size="17">새로운</text><text x="360" y="454" font-size="17">덱 조합</text><text x="360" y="574" font-size="11">강제 순서 아님 · 실제 규칙과 아트 미확정</text></g></svg>
