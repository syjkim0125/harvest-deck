acity and opportunity cost</text><text x="380" y="365" font-size="13">Changing location may leave another task uncovered</text><text x="380" y="413" font-size="12" fill="#b7ceca">Capacity, role slots, transfer rules, UI and final art remain pending.</text></g></svg>