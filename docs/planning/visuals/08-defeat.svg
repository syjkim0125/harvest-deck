<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 476" width="920" height="476" role="img"><title>Defeat becomes a story</title><rect width="920" height="476" rx="18" fill="#101c2e"/><text x="28" y="43" fill="#f0f3f5" font-size="25" font-family="sans-serif" font-weight="bold">Defeat becomes a story</text><text x="28" y="72" fill="#abc0d0" font-size="15" font-family="sans-serif">D16 | the world continues after loss</text><rect x="28" y="92" width="422" height="88" rx="10" fill="#203249" stroke="#80c8ba" stroke-width="1.5"/><text x="239" y="124" text-anchor="middle" fill="#80c8ba" font-size="18" font-weight="bold" font-family="sans-serif">Defeat</text><text x="239" y="152" text-anchor="middle" fill="#e3edf2" font-size="14" font-family="sans-serif">pirate / military / hazard</text><path d="M453 136 h14 m-5 -4 l5 4 -5 4" fill="none" stroke="#9eb6c8" stroke-width="2"/><rect x="470" y="92" width="422" height="88" rx="10" fill="#203249" stroke="#d8b57b" stroke-width="1.5"/><text x="681" y="124" text-anchor="middle" fill="#d8b57b" font-size="18" font-weight="bold" font-family="sans-serif">Loss</text><text x="681" y="152" text-anchor="middle" fill="#e3edf2" font-size="14" font-family="sans-serif">ship / cargo / captivity</text><path d="M460 181 v17 m-5 -5 l5 5 5 -5" fill="none" stroke="#9eb6c8" stroke-width="2"/><rect x="28" y="204" width="422" height="88" rx="10" fill="#203249" stroke="#d8b57b" stroke-width="1.5"/><text x="239" y="236" text-anchor="middle" fill="#d8b57b" font-size="18" font-weight="bold" font-family="sans-serif">Survive</text><text x="239" y="264" text-anchor="middle" fill="#e3edf2" font-size="14" font-family="sans-serif">escape / rescue / negotiation</text><path d="M453 248 h14 m-5 -4 l5 4 -5 4" fill="none" stroke="#9eb6c8" stroke-width="2"/><rect x="470" y="204" width="422" height="88" rx="10" fill="#203249" stroke="#9eafea" stroke-width="1.5"/><text x="681" y="236" text-anchor="middle" fill="#9eafea" font-size="18" font-weight="bold" font-family="sans-serif">Rebuild</text><text x="681" y="264" text-anchor="middle" fill="#e3edf2" font-size="14" font-family="sans-serif">trade / crew / new ship</text><path d="M460 293 v17 m-5 -5 l5 5 5 -5" fill="none" stroke="#9eb6c8" stroke-width="2"/><rect x="28" y="316" width="422" height="88" rx="10" fill="#203249" stroke="#9eafea" stroke-width="1.5"/><text x="239" y="348" text-anchor="middle" fill="#9eafea" font-size="18" font-weight="bold" font-family="sans-serif">Encounter again</text><text x="239" y="376" text-anchor="middle" fill="#e3edf2" font-size="14" font-family="sans-serif">old ship or companion</text><path d="M453 360 h14 m-5 -4 l5 4 -5 4" fill="none" stroke="#9eb6c8" stroke-width="2"/><rect x="470" y="316" width="422" height="88" rx="10" fill="#203249" stroke="#dc8b80" stroke-width="1.5"/><text x="681" y="348" text-anchor="middle" fill="#dc8b80" font-size="18" font-weight="bold" font-family="sans-serif">Choose</text><text x="681" y="376" text-anchor="middle" fill="#e3edf2" font-size="14" font-family="sans-serif">recover / negotiate / move on</text><text x="28" y="454" fill="#a8bdcc" font-size="14" font-family="sans-serif">Permanent death, save rules and exact penalties pending.</text></svg>