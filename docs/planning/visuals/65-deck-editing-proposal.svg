>Reconfigure without forced return</text><text x="595" y="219" font-size="10">Preserve resources and prior outcomes</text><path d="M230 151h25m210 0h25" stroke="#c5b58e" stroke-width="2"/><text x="360" y="280" font-size="15">No mid-encounter free redraw or task reset</text><text x="360" y="314" font-size="12">Illustrative only · safety, presets, transition rules and UI unresolved</text></g></svg>
