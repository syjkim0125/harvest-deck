<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img"><title>Resource gathering — D26</title><rect width="760" height="460" rx="18" fill="#172d30"/><g font-family="sans-serif" fill="#e3ebdf"><text x="380" y="34" text-anchor="middle" font-size="23" font-weight="bold">Resource gathering — D26</text><text x="380" y="59" text-anchor="middle" font-size="14" fill="#b4cbbf">Two layers preserve exploration flow and meaningful special actions</text><rect x="25" y="85" width="335" height="73" rx="10" fill="#263f43" stroke="#91d6b7"/><text x="192.5" y="112" text-anchor="middle" font-size="17" font-weight="bold" fill="#91d6b7">Common resources</text><text x="192.5" y="135" text-anchor="middle" font-size="13">Short interaction; keep exploring</text><rect x="400" y="85" width="335" height="73" rx="10" fill="#263f43" stroke="#dfb882"/><text x="567.5" y="112" text-anchor="middle" font-size="17" font-weight="bold" fill="#dfb882">Special resources</text><text x="567.5" y="135" text-anchor="middle" font-size="13">Action, tools, companions</text><path d="M192 158V183M567 158V183" stroke="#afc5b8" stroke-width="2"/><g transform="translate(25 183)"><rect width="335" height="183" rx="12" fill="#304c42" stroke="#719a84"/><path d="M100 119Q90 70 114 42Q143 75 100 119M100 119Q145 54 172 80Q155 116 100 119" fill="#8cc593" stroke="#b4d5a0"/><path d="M100 119L101 147" stroke="#c1d7b1" stroke-width="4"/><path d="M191 125l17 -34 29 -12 28 34-12 20h-50z" fill="#94b9c5" stroke="#cee3df"/><text x="167" y="165" text-anchor="middle" font-size="14">Plants, fragments, small salvage</text></g><g transform="translate(400 183)"><rect width="335" height="183" rx="12" fill="#304c42" stroke="#9eab86"/><path d="M32 136L48 79L93 35L128 89L136 136Z" fill="#719caa" stroke="#b7d9d7"/><path d="M93 35L80 93L100 110L86 135" stroke="#f0dbb1" stroke-width="4" fill="none"/><path d="M145 81l15 -12 8 15-14 9zM130 50l12 -12 8 11-12 8z" fill="#cee2d3"/><ellipse cx="230" cy="113" rx="24" ry="16" fill="#d1b78d"/><circle cx="221" cy="110" r="3" fill="#213a33"/><circle cx="239" cy="110" r="3" fill="#213a33"/><path d="M204 74H255" stroke="#b8d8d5" stroke-width="6"/><text x="167" y="165" text-anchor="middle" font-size="14">Impact, extraction, tool / crew assistance</text></g><text x="380" y="402" text-anchor="middle" font-size="16" fill="#c9ddc8">Rare resources: meaningful preparation, not mandatory repetitive minigames</text><text x="380" y="438" text-anchor="middle" font-size="13" fill="#b4cbbf">Approved principle; resource types, tools, gestures and risks are examples.</text></g></svg>