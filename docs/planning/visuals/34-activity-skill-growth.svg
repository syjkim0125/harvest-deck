<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img"><title>D34 activity and skill choice</title><rect width="760" height="470" rx="18" fill="#182e35"/><g font-family="sans-serif" fill="#e3ece3"><text x="380" y="32" font-size="23" font-weight="bold" text-anchor="middle">Activity → proficiency → meaningful choice</text><text x="380" y="57" font-size="14" text-anchor="middle" fill="#b7ceca">D34 principle approved — exploration example</text><rect x="190" y="79" width="380" height="65" rx="10" fill="#304a49" stroke="#80b4d0"/><text x="380" y="105" text-anchor="middle" font-size="17" font-weight="bold">Explore an unknown star system</text><text x="380" y="126" font-size="13" text-anchor="middle">Discover signals and environmental clues</text><path d="M380 144v22" stroke="#91c5ac" stroke-width="3"/><rect x="190" y="167" width="380" height="67" rx="10" fill="#304a49" stroke="#91c5ac"/><text x="380" y="192" font-size="17" font-weight="bold" text-anchor="middle">Exploration proficiency</text><rect x="225" y="203" width="310" height="9" rx="4" fill="#7ebfa8"/><text x="380" y="225" font-size="12" text-anchor="middle">Opportunity to learn (example)</text><path d="M380 234V253H134V275" stroke="#80b4d0" fill="none" stroke-width="2"/><rect x="18" y="275" width="232" height="80" rx="10" fill="#304a49" stroke="#80b4d0"/><text x="134" y="304" text-anchor="middle" font-size="16" font-weight="bold" fill="#80b4d0">Deep scan</text><text x="134" y="329" text-anchor="middle" font-size="13">Hidden signals</text><path d="M380 234V253H380V275" stroke="#83bfa0" fill="none" stroke-width="2"/><rect x="264" y="275" width="232" height="80" rx="10" fill="#304a49" stroke="#83bfa0"/><text x="380" y="304" text-anchor="middle" font-size="16" font-weight="bold" fill="#83bfa0">Ecology analysis</text><text x="380" y="329" text-anchor="middle" font-size="13">Habitats / behavior</text><path d="M380 234V253H626V275" stroke="#c8b07c" fill="none" stroke-width="2"/><rect x="510" y="275" width="232" height="80" rx="10" fill="#304a49" stroke="#c8b07c"/><text x="626" y="304" text-anchor="middle" font-size="16" font-weight="bold" fill="#c8b07c">Ancient tech reading</text><text x="626" y="329" text-anchor="middle" font-size="13">Relics / devices</text><text x="380" y="390" font-size="15" text-anchor="middle" fill="#c2dfca">Non-combat activities can also develop expertise.</text><text x="380" y="420" font-size="13" text-anchor="middle">Training, mentors and research are candidate learning paths.</text><text x="380" y="446" font-size="12" text-anchor="middle" fill="#b7ceca">Illustrative skills and gauge; exact unlocks, costs and mastery limits pending.</text></g></svg>