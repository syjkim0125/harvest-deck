<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 438" role="img"><title>D45 companion loss and recovery — approved principle</title><rect width="760" height="438" rx="16" fill="#192e35"/><g font-family="sans-serif" fill="#e3ece3" text-anchor="middle"><text x="380" y="32" font-size="22" font-weight="bold">Consequences that preserve individual stories</text><text x="380" y="56" font-size="14" fill="#b7ceca">D45 principle approved — illustrative examples</text><rect x="18" y="85" width="230" height="160" rx="12" fill="#30494a" stroke="#8abbd5"/><text x="133" y="112" font-size="15" font-weight="bold" fill="#8abbd5">Injury</text><path d="M133 125v16m-4 -4 4 4 4 -4" fill="none" stroke="#8abbd5"/><text x="133" y="163" font-size="13">Treatment and rest</text><path d="M133 175v15m-4 -4 4 4 4 -4" fill="none" stroke="#8abbd5"/><text x="133" y="215" font-size="14">Possible return</text><rect x="264" y="85" width="230" height="160" rx="12" fill="#30494a" stroke="#8ac3a1"/><text x="379" y="112" font-size="15" font-weight="bold" fill="#8ac3a1">Missing after defeat</text><path d="M379 125v16m-4 -4 4 4 4 -4" fill="none" stroke="#8ac3a1"/><text x="379" y="163" font-size="13">Search or rescue</text><path d="M379 175v15m-4 -4 4 4 4 -4" fill="none" stroke="#8ac3a1"/><text x="379" y="215" font-size="14">Possible reunion</text><rect x="510" y="85" width="230" height="160" rx="12" fill="#30494a" stroke="#d4b47e"/><text x="625" y="112" font-size="15" font-weight="bold" fill="#d4b47e">Conflict or separation</text><path d="M625 125v16m-4 -4 4 4 4 -4" fill="none" stroke="#d4b47e"/><text x="625" y="163" font-size="13">Respect choices / reconcile</text><path d="M625 175v15m-4 -4 4 4 4 -4" fill="none" stroke="#d4b47e"/><text x="625" y="215" font-size="14">Possible rejoining</text><rect x="80" y="270" width="600" height="75" rx="10" fill="#493d3b" stroke="#c17e73"/><text x="380" y="296" font-size="16" font-weight="bold">Conditional permanent departure or loss</text><text x="380" y="320" font-size="13">Only with explicitly designed consequences; exact conditions pending.</text><text x="380" y="378" font-size="14">Persistent world + meaningful recovery opportunities</text><text x="380" y="404" font-size="12" fill="#b7ceca">Death rules, probabilities, rejoining, safety options and UI not approved.</text><text x="380" y="423" font-size="11" fill="#b7ceca">Explanatory diagram, not final gameplay or art.</text></g></svg>