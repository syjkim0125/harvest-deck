<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640"><rect width="720" height="640" rx="14" fill="#172434"/><g font-family="sans-serif" fill="#edf3f5" text-anchor="middle"><text x="360" y="28" font-size="18">D67 — 교차 시너지 비교와 성장 (재구성)</text><g transform="translate(15 45)"><rect width="220" height="120" rx="8" fill="#293b4c"/><text x="110" y="23" font-size="14">A. 독립·공유 성장</text><rect x="12" y="38" width="78" height="50" rx="6" fill="#625482"/><text x="51" y="67" font-size="12">전술 덱</text><rect x="130" y="38" width="78" height="50" rx="6" fill="#477664"/><text x="169" y="67" font-size="12">운용 덱</text><text x="110" y="65" font-size="18">·</text><text x="110" y="106" font-size="11">공유 성장</text></g><g transform="translate(250 45)"><rect width="220" height="120" rx="8" fill="#293b4c"/><text x="110" y="23" font-size="14">B. 직접 카드 연쇄</text><rect x="12" y="38" width="78" height="50" rx="6" fill="#625482"/><text x="51" y="67" font-size="12">전술 덱</text><rect x="130" y="38" width="78" height="50" rx="6" fill="#477664"/><text x="169" y="67" font-size="12">운용 덱</text><text x="110" y="65" font-size="18">↔</text><text x="110" y="106" font-size="11">직접 보너스</text></g><g transform="translate(485 45)"><rect width="220" height="120" rx="8" fill="#293b4c"/><text x="110" y="23" font-size="14">C. 실제 결과 매개</text><rect x="12" y="38" width="78" height="50" rx="6" fill="#625482"/><text x="51" y="67" font-size="12">전술 덱</text><rect x="130" y="38" width="78" height="50" rx="6" fill="#477664"/><text x="169" y="67" font-size="12">운용 덱</text><text x="110" y="65" font-size="18">▣</text><text x="110" y="106" font-size="11">실물·정보·관계</text></g><g transform="translate(15 180)"><rect width="340" height="95" rx="8" fill="#625482"/><text x="32" y="48" font-size="25">◎</text><text x="190" y="25" font-size="11">전술 → 운용</text><text x="190" y="48" font-size="15">약점 기록</text><text x="190" y="71" font-size="12">실제 약점 데이터 → 연구 기회</text></g><g transform="translate(365 180)"><rect width="340" height="95" rx="8" fill="#477664"/><text x="32" y="48" font-size="25">▣</text><text x="190" y="25" font-size="11">전술 → 운용</text><text x="190" y="48" font-size="15">잔해 분석</text><text x="190" y="71" font-size="12">회수 장비 → 연구 기회</text></g><g transform="translate(15 285)"><rect width="340" height="95" rx="8" fill="#477664"/><text x="32" y="48" font-size="25">⚙</text><text x="190" y="25" font-size="11">운용 → 전술</text><text x="190" y="48" font-size="15">무기 최적화</text><text x="190" y="71" font-size="12">실제 장비 개조 → 특화 기회</text></g><g transform="translate(365 285)"><rect width="340" height="95" rx="8" fill="#477664"/><text x="32" y="48" font-size="25">✿</text><text x="190" y="25" font-size="11">운용 → 전술</text><text x="190" y="48" font-size="15">생태 교감</text><text x="190" y="71" font-size="12">관계 성장 → 고유 합동 전술</text></g><g transform="translate(15 400)"><rect width="690" height="60" rx="8" fill="#477664"/><text x="112" y="35" font-size="14">평화로운 탐험가</text><text x="438" y="35" font-size="12">탐험 → 유물 발견 → 연구 → 기술 판매 → 탐험 장비</text></g><g transform="translate(15 468)"><rect width="690" height="60" rx="8" fill="#625482"/><text x="112" y="35" font-size="14">현상금 사냥꾼</text><text x="438" y="35" font-size="12">전투 → 보상 → 장비 구매/제작 위임 → 전술 강화</text></g><g transform="translate(15 536)"><rect width="690" height="60" rx="8" fill="#896f54"/><text x="112" y="35" font-size="14">은하계 상인</text><text x="438" y="35" font-size="12">교역 → 자본 → 기술 구매 → 상점 확장 → 동료</text></g><text x="360" y="625" font-size="11">설명용 재구성 · 실제 카드 효과·아트 미확정</text></g></svg>