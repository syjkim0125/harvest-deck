<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D51 거점 성장 예시 재구성</title><style>body{font:16px system-ui;background:#202b35;color:#f4f6f8;max-width:520px;margin:2rem auto;padding:1rem}button{padding:.7rem;margin:.25rem}#map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#796d55;padding:16px;border-radius:12px}.module{background:#aab9bf;color:#13222a;padding:20px 8px;text-align:center;border-radius:8px}</style><h1>D51 거점 성장 예시</h1><p>이전 채팅 인터랙션의 재구성. 실제 UI·시설·배치 승인 아님.</p><div><button onclick="show(1)">초기</button><button onclick="show(2)">성장</button><button onclick="show(3)">확장</button></div><h2 id="stage"></h2><div id="map"></div><script>const modules=['🛸 착륙장','🏠 생활 시설','⛏️ 채굴 시설','🔬 연구소','📦 창고','🌿 생태 시설','⚙️ 제작 공장','🛡️ 방어 시설'];function show(n){document.getElementById('stage').textContent=['소규모 전초기지','전문화된 연구·산업 거점','복합 산업 기지'][n-1];document.getElementById('map').replaceChildren(...modules.slice(0,[3,5,8][n-1]).map(s=>{const el=document.createElement('div');el.className='module';el.textContent=s;return el}))}show(2)</script></html>
