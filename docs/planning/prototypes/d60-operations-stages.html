<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D60 작업 단계별 운용 덱</title><style>body{font:16px system-ui;background:#172434;color:#edf3f5;max-width:520px;margin:2rem auto;padding:1rem}button{font:inherit;color:inherit;background:#344a5d;border:1px solid #839bad;border-radius:8px;padding:.7rem;cursor:pointer}#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{display:grid;align-content:start;gap:8px;min-height:155px}.symbol{background:#477664;font-size:30px;padding:12px;border-radius:5px}#result{padding:1rem;background:#26394c;border-radius:8px}.controls{display:grid;gap:8px}</style><h1>작업 단계별 운용 덱</h1><p>채팅 예시 재구성 · 실제 작업 성공 및 경제 규칙 아님</p><h2 id="title"></h2><div id="cards"></div><p id="result" aria-live="polite"></p><div class="controls"><button id="basic">카드 없이 기본 활동 진행</button><button id="reset">다시 시작</button></div><script>const phases=[{"title":"외계 유적 발견","cards":[["◎","심층 탐사","숨겨진 기술 단서를 발견"],["✿","생태 교감","생명체가 알려주는 경로 발견"],["◇","안전 경로","위험한 구역을 우회"]]},{"title":"유적 내부 조사","cards":[["⚗","유물 분석","유물의 특성 파악"],["✥","동료 협력","동료의 전문 기술 활용"],["▣","정밀 채집","희귀 재료 확보 기회"]]},{"title":"탐험 결과 활용","cards":[["⚙","기술 연구","새로운 장비 연구 기회"],["✿","생태 연구","생명체의 특성 연구"],["◆","유물 교역","발견한 유물 거래"]]}];let step=0,result='';function advance(msg){result=msg;step=(step+1)%3;render()}function render(){document.getElementById('title').textContent=phases[step].title+' · '+(step+1)+'/3 단계';document.getElementById('cards').replaceChildren(...phases[step].cards.map(([symbol,name,desc])=>{let b=document.createElement('button');b.className='card';let s=document.createElement('span');s.className='symbol';s.textContent=symbol;let n=document.createElement('strong');n.textContent=name;let d=document.createElement('small');d.textContent=desc;b.append(s,n,d);b.onclick=()=>advance(name+' 선택 · '+desc);return b}));document.getElementById('result').textContent=result||'카드를 선택하여 다음 작업 단계로 진행해 봐.'}document.getElementById('basic').onclick=()=>advance('카드 없이 기본 탐험 활동 진행');document.getElementById('reset').onclick=()=>{step=0;result='';render()};render()</script></html>
