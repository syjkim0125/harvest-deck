<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D59 전술 에너지 회복</title><style>body{font:16px system-ui;background:#172434;color:#edf3f5;max-width:520px;margin:2rem auto;padding:1rem}button{font:inherit;color:inherit;background:#344a5d;border:1px solid #839bad;border-radius:8px;padding:.7rem;text-align:left;cursor:pointer}button:disabled{opacity:.45}#energy{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}#energy span{height:17px;background:#344758;border-radius:4px}#energy .full{background:#c6a663}#actions{display:grid;gap:8px;margin:1rem 0}#log{background:#26394c;border-radius:8px;padding:1rem}</style><h1>전술 에너지 회복</h1><p>채팅 예시 재구성 · 실제 회복·전투 판정 아님</p><h2 id="count"></h2><div id="energy"></div><div id="actions"></div><button id="cast">중력 제어 카드 사용 (−3)</button><p id="log" aria-live="polite"></p><button id="reset">다시 시작</button><script>let energy=2,bonus=2,log='현재 에너지 2. 다양한 행동을 선택해 봐.';const actions=[['기본 시간 경과','기본 회복',true],['적의 공격 회피 성공','행동 보너스',true],['적의 약점 공략 성공','행동 보너스',true],['아무것도 없는 곳에서 공격','보너스 없음',false],['위협 없이 반복 회피','보너스 없음',false]];function render(){document.getElementById('count').textContent='전술 에너지 '+energy+' / 6';document.getElementById('energy').replaceChildren(...Array.from({length:6},(_,i)=>{let s=document.createElement('span');s.className=i<energy?'full':'';return s}));document.getElementById('log').textContent=log+' · 보너스 잔여 '+bonus+'회';document.getElementById('cast').disabled=energy<3}actions.forEach(([name,detail,valid],i)=>{let b=document.createElement('button');b.textContent=name+' · '+detail;b.onclick=()=>{let gain=i===0?1:valid&&bonus>0?1:0;let old=energy;energy=Math.min(6,energy+gain);if(i>0&&valid&&bonus>0&&old<6)bonus--;log=name+' · '+(old===6?'이미 최대 에너지':gain>0?'에너지 +1':valid?'추가 회복 제한 도달':'회복 없음');render()};document.getElementById('actions').append(b)});document.getElementById('cast').onclick=()=>{if(energy>=3){energy-=3;log='중력 제어 발동 · 에너지 3 소모';render()}};document.getElementById('reset').onclick=()=>{energy=2;bonus=2;log='초기 상태로 돌아왔어.';render()};render()</script></html>
