<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D66 덱 크기 예시</title><style>body{font:16px system-ui;background:#172434;color:#edf3f5;max-width:520px;margin:2rem auto;padding:1rem}input{width:100%;accent-color:#8cb8a1}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:1rem 0}.cards div{border-radius:8px;padding:12px 3px;text-align:center;min-height:55px;font-size:12px}.symbol{font-size:24px;display:block;margin-bottom:6px}#desc{background:#26394c;padding:1rem;border-radius:8px}</style><h1>전술 덱 크기</h1><p>채팅 예시 재구성 · 실제 맥락 드로우 미반영</p><h2 id="count"></h2><input id="size" type="range" min="6" max="10" value="8" aria-label="전술 덱 크기"><div id="cards" class="cards"></div><p>첫 3장에 EMP가 포함될 확률: <strong id="prob"></strong></p><p id="cycle"></p><p id="desc"></p><small>EMP 2장, 무작위 비복원 드로우, 초기 손패 3장 가정. 실제 카드 수·드로우·맥락 필터는 미확정.</small><script>const cards=[["ϟ","EMP 방출"],["ϟ","EMP 방출"],["◎","약점 탐지"],["◈","보호막 강화"],["✥","드론 편대"],["↗","긴급 기동"],["⊕","정밀 타격"],["✦","중력 제어"],["◇","환경 보호"],["⚙","긴급 수리"]];const slider=document.getElementById('size');function render(){let n=+slider.value;document.getElementById('count').textContent=n+'장';document.getElementById('cards').replaceChildren(...cards.map(([e,t],i)=>{let d=document.createElement('div'),s=document.createElement('span');d.style.background=i<n?(i===4?'#477664':'#625482'):'#344758';s.className='symbol';s.textContent=i<n?e:'+';d.append(s,i<n?t:'빈 슬롯');return d}));document.getElementById('prob').textContent=(100*(1-(n-3)*(n-4)/(n*(n-1)))).toFixed(1)+'%';document.getElementById('cycle').textContent='전체 카드 순환 길이: '+n+'장';document.getElementById('desc').textContent=n<=7?'집중형: 핵심 전술 순환, 대응 수단 감소':n<=9?'균형형: 순환 및 상황 대응':'다목적형: 다양한 상황 대응, 원하는 카드 등장 빈도 감소'}slider.oninput=render;render()</script></html>
