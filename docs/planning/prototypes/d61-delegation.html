<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D61 동료 위임과 예외 거래</title><style>body{font:16px system-ui;background:#172434;color:#edf3f5;max-width:520px;margin:2rem auto;padding:1rem}button{font:inherit;color:inherit;background:#344a5d;border:1px solid #839bad;border-radius:8px;padding:.7rem;cursor:pointer}button[aria-pressed=true]{background:#477664}section{border:1px solid #698197;border-radius:12px;padding:1rem;margin:1rem 0}svg{width:100%;display:block}.buttons{display:flex;gap:8px;flex-wrap:wrap}label{display:block;margin:.5rem 0}#desc,#tradeResult{background:#26394c;padding:.8rem;border-radius:8px}</style><h1>직접 운영 · 동료 위임</h1><p>채팅 예시 재구성 · 실제 정책과 거래 실행 아님</p><section><div class="buttons"><button id="direct">직접 운영</button><button id="auto">동료 위임</button></div><svg viewBox="0 0 340 130"><rect width="340" height="130" rx="10" fill="#172434"/><rect x="15" y="15" width="133" height="100" rx="8" fill="#345463"/><circle cx="81" cy="43" r="15" fill="#e1c29f"/><rect id="shirt" x="65" y="60" width="32" height="30" rx="9" fill="#93b1c3"/><text id="actor" x="81" y="105" font-size="11" text-anchor="middle" fill="#e8eff3">플레이어</text><path d="M151 63h31" stroke="#c3d2dc" stroke-width="2"/><rect x="191" y="36" width="38" height="57" rx="5" fill="#477664" stroke="#8eb5a0"/><text x="210" y="71" font-size="20" fill="#fff" text-anchor="middle">◎</text><rect x="236" y="36" width="38" height="57" rx="5" fill="#477664" stroke="#8eb5a0"/><text x="255" y="71" font-size="20" fill="#fff" text-anchor="middle">▣</text><rect x="281" y="36" width="38" height="57" rx="5" fill="#477664" stroke="#8eb5a0"/><text x="300" y="71" font-size="20" fill="#fff" text-anchor="middle">↔</text><text x="255" y="109" font-size="10" text-anchor="middle" fill="#c6d9ce">운용 카드 선택</text></svg><div id="policies" hidden><h3>운영 방향</h3><label><input type="radio" name="policy" value="profit"> 수익 우선</label><label><input type="radio" name="policy" value="balanced" checked> 균형 운영</label><label><input type="radio" name="policy" value="growth"> 고객 확보 우선</label></div><p id="desc" aria-live="polite"></p></section><section><h2>상점 담당 동료의 연락</h2><p>선장님! 희귀 장비를 대량으로 구매하고 싶다는 상인이 방문했어요. 다만 설정한 할인 범위를 초과했습니다.</p><div class="buttons" id="trade"><button data-value="approve">거래 승인</button><button data-value="negotiate">재협상</button><button data-value="reject">거절</button></div><p id="tradeResult" aria-live="polite" hidden></p><button id="reset" hidden>다시 선택</button></section><script>let mode='direct',policy='balanced';const policies={profit:'높은 마진의 상품과 거래를 우선하며 과도한 할인을 피함.',balanced:'수익과 재고 회전율을 고려해 운용 카드를 선택.',growth:'허용된 예산 내에서 할인과 상품 진열을 활용해 고객 확보를 시도.'};function render(){document.getElementById('direct').setAttribute('aria-pressed',mode==='direct');document.getElementById('auto').setAttribute('aria-pressed',mode==='auto');document.getElementById('actor').textContent=mode==='direct'?'플레이어':'상점 담당 동료';document.getElementById('shirt').setAttribute('fill',mode==='direct'?'#93b1c3':'#9dbda1');document.getElementById('policies').hidden=mode==='direct';document.getElementById('desc').textContent=mode==='direct'?'재고와 고객 상황에 따라 직접 카드 선택. 특수 거래와 새로운 조합 활용 가능.':policies[policy]}for(const id of ['direct','auto'])document.getElementById(id).onclick=()=>{mode=id;render()};document.querySelectorAll('[name=policy]').forEach(b=>b.onchange=()=>{policy=b.value;render()});const outcomes={approve:'예외적인 거래 조건을 승인했어.',negotiate:'동료에게 새로운 거래 조건을 제안하도록 지시했어.',reject:'거래를 거절하고 기존 운영 정책을 유지해.'};document.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{document.getElementById('trade').hidden=true;document.getElementById('tradeResult').hidden=false;document.getElementById('tradeResult').textContent=outcomes[b.dataset.value];document.getElementById('reset').hidden=false});document.getElementById('reset').onclick=()=>{document.getElementById('trade').hidden=false;document.getElementById('tradeResult').hidden=true;document.getElementById('reset').hidden=true};render()</script></html>
