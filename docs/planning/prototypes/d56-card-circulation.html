<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D56 전술 카드 순환 예시</title><style>body{font:16px system-ui;background:#172434;color:#edf3f5;max-width:520px;margin:2rem auto;padding:1rem}button{font:inherit;color:inherit;background:#344a5d;border:1px solid #839bad;border-radius:8px;padding:.7rem;cursor:pointer}button:disabled{opacity:.4;cursor:default}#hand{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{display:grid;gap:8px}.face{min-height:150px;display:grid;align-content:start;gap:6px}.symbol{font-size:32px;padding:14px;border-radius:5px}small{font-size:12px}svg{width:100%}#log{background:#26394c;padding:1rem;border-radius:8px}</style><h1>전술 카드 순환</h1><p>채팅 예시 재구성 · 전투 및 최종 규칙 아님</p><svg viewBox="0 0 340 152"><rect width="340" height="152" rx="10" fill="#101c2b"/><circle cx="20" cy="140" r="52" fill="#365773"/><g transform="translate(91 104) rotate(45)"><path d="M0 -24 L9 -5 L23 17 L0 10 L-23 17 L-9 -5Z" fill="#9cbfd7"/><path d="M-7 13L0 34L7 13" fill="#e5ae72"/></g><g transform="translate(253 45) rotate(220)"><path d="M0 -24L12 3L23 17L0 10L-23 17L-12 3Z" fill="#b9756b"/></g><path d="M112 91L225 56" stroke="#9fdac9" stroke-dasharray="4 7" stroke-width="2"/><circle cx="253" cy="45" r="34" fill="none" stroke="#d68d7d" stroke-dasharray="4 5"/></svg><p id="counts"></p><div id="hand"></div><p id="log" aria-live="polite"></p><button id="reset">다시 시작</button><script>const cards=[["약점 탐지","◎","#416e91","적의 약점을 탐지"],["EMP 방출","ϟ","#68538c","적의 기능을 교란"],["보호막 강화","◈","#3c7a79","방어 능력 강화"],["정밀 타격","⊕","#996747","적의 약점을 공격"],["추진력 강화","↗","#516e96","기동 능력 강화"],["드론 지원","✥","#7a6890","동료 드론 지원"]];const initial=()=>({hand:[0,1,2],draw:[3,4,5],discard:[],swap:1,log:'사용할 전술 카드를 선택해 봐.'});let g=initial();function play(i,swap=false){if(swap&&g.swap===0)return;const used=g.hand[i];g.discard.push(used);if(!g.draw.length){g.draw=g.discard;g.discard=[]}g.hand[i]=g.draw.shift();if(swap)g.swap--;g.log=cards[used][0]+(swap?' 교체':' 발동')+' → '+cards[g.hand[i]][0]+' 드로우';render()}function render(){document.getElementById('counts').textContent='드로우 '+g.draw.length+'장 · 버림 '+g.discard.length+'장 · 교체 '+g.swap+'회';document.getElementById('log').textContent=g.log;document.getElementById('hand').replaceChildren(...g.hand.map((id,i)=>{let wrap=document.createElement('div');wrap.className='card';let face=document.createElement('button');face.className='face';let sym=document.createElement('span');sym.className='symbol';sym.style.background=cards[id][2];sym.textContent=cards[id][1];let name=document.createElement('strong');name.textContent=cards[id][0];let desc=document.createElement('small');desc.textContent=cards[id][3];face.append(sym,name,desc);face.onclick=()=>play(i);let btn=document.createElement('button');btn.textContent='교체';btn.disabled=!g.swap;btn.onclick=()=>play(i,true);wrap.append(face,btn);return wrap}))}document.getElementById('reset').onclick=()=>{g=initial();render()};render()</script></html>
