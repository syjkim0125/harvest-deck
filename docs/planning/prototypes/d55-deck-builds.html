<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D55 직업별 덱 예시</title><style>body{font:16px system-ui;background:#182535;color:#edf3f5;max-width:520px;margin:2rem auto;padding:1rem}button{padding:.7rem;margin:.25rem;border-radius:8px}section{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}section span{background:#62537f;padding:18px 8px;border-radius:9px;text-align:center}#ops span{background:#3d7061}</style><h1>직업별 덱 조합 예시</h1><p>채팅 인터랙션 재구성 · 실제 카드 규칙 아님</p><div id="buttons"></div><h2>전술 덱</h2><section id="tac"></section><h2>운용 덱</h2><section id="ops"></section><h3>교차 시너지</h3><p id="synergy"></p><script>const builds={"explorer":{"title":"탐험가","t":["위험 감지","긴급 회피","중력 제어"],"o":["심층 탐사","생태 교감","유물 분석"],"s":"외계 기술·생명체의 능력이 생존·회피 전술로 연결"},"hunter":{"title":"현상금 사냥꾼","t":["EMP 방출","약점 타격","함선 제압"],"o":["현상금 추적","무기 개조","잔해 분석"],"s":"정보와 회수 부품이 다음 전투 장비·전술로 연결"},"merchant":{"title":"상인","t":["보호막 강화","긴급 탈출","호위 지원"],"o":["시장 분석","화물 최적화","협상"],"s":"교역의 장비·정보가 수송 능력과 위험 대응을 강화"}};function show(id){const b=builds[id];for(const [target,key] of [['tac','t'],['ops','o']])document.getElementById(target).replaceChildren(...b[key].map(n=>{let s=document.createElement('span');s.textContent=n;return s}));document.getElementById('synergy').textContent=b.s}for(const [id,b] of Object.entries(builds)){let e=document.createElement('button');e.textContent=b.title;e.onclick=()=>show(id);document.getElementById('buttons').append(e)}show('explorer')</script></html>
