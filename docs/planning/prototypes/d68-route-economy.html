<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D68 항로 경제 예시</title><style>body{font:16px system-ui;background:#172434;color:#edf3f5;max-width:520px;margin:2rem auto;padding:1rem}button{font:inherit;color:inherit;background:#344a5d;border:1px solid #839bad;border-radius:8px;padding:.7rem;cursor:pointer}button[aria-pressed=true]{background:#477664}svg{width:100%;display:block}.row{display:flex;gap:8px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.metrics strong{display:block;font-size:1.5rem}#bar{height:12px;border-radius:8px;background:#344758;overflow:hidden}#fill{height:100%}</style><h1>항로 차단과 공급망</h1><p>채팅 예시 재구성 · 실제 경제 계산 아님</p><div class="row"><button data-route="normal">정상</button><button data-route="blocked">해적 출현</button><button data-route="restored">항로 복구</button></div><svg viewBox="0 0 340 170"><rect width="340" height="170" rx="10" fill="#111e2b"/><circle cx="52" cy="78" r="33" fill="#927963"/><circle cx="288" cy="78" r="33" fill="#5a8172"/><path id="route" d="M85 78H255" stroke-dasharray="5 5" stroke-width="2.5"/><g id="ships"></g><g id="pirates"><circle cx="170" cy="78" r="29" fill="#b76159" fill-opacity=".16" stroke="#be7c75"/><path d="M0 -16L15 12L0 7L-15 12Z" transform="translate(150 64) rotate(220)" fill="#b9756b"/><path d="M0 -16L15 12L0 7L-15 12Z" transform="translate(189 91) rotate(220)" fill="#b9756b"/></g><text id="status" x="170" y="28" font-size="11" text-anchor="middle" fill="#c6d6e1"/><text x="52" y="130" font-size="11" text-anchor="middle" fill="#d8e4eb">생산지</text><text x="288" y="130" font-size="11" text-anchor="middle" fill="#d8e4eb">소비지</text><text id="label" x="170" y="156" font-size="10" text-anchor="middle" fill="#c0d0db"/></svg><div class="metrics"><div>소비지 재고<strong id="stock"></strong></div><div>상품 가격<strong id="price"></strong></div><div>수송량<strong id="supply"></strong></div></div><div id="bar"><div id="fill"></div></div><p id="desc" aria-live="polite"></p><small>수량·가격은 고정 설명 상태이며 CR은 임시 화폐 표기.</small><script>const markets={"normal":{"stock":80,"price":100,"supply":20,"label":"정상적인 공급"},"blocked":{"stock":20,"price":220,"supply":0,"label":"교역로 차단 후 재고 감소"},"restored":{"stock":60,"price":125,"supply":15,"label":"공급망 점진적 회복"}},by=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';const descriptions={normal:'NPC들이 정상적으로 상품을 거래하고 있어.',blocked:'공급 중단과 기존 재고 소비로 가격이 상승하는 상황. 교역·호위 기회가 생길 수 있어.',restored:'공급을 재개하면 재고와 가격이 점진적으로 안정될 수 있어.'};function render(k){let s=markets[k],blocked=k==='blocked';by('route').setAttribute('stroke',blocked?'#bd7970':'#89b5a6');by('pirates').setAttribute('visibility',blocked?'visible':'hidden');by('ships').replaceChildren(...(blocked?[]:[122,k==='normal'?170:200,220].map(x=>{let p=document.createElementNS(ns,'path');p.setAttribute('d','M0 -10L18 0L0 10L-7 0Z');p.setAttribute('transform','translate('+x+' 78)');p.setAttribute('fill','#b1c9d5');return p})));by('status').textContent=blocked?'항로 위험 발생':k==='normal'?'화물선 이동 중':'화물선 운송 재개';by('label').textContent=s.label;by('stock').textContent=s.stock+'개';by('price').textContent=s.price+' CR';by('supply').textContent=s.supply+'개';by('fill').style.width=s.stock+'%';by('fill').style.background=blocked?'#bc7969':'#699d85';by('desc').textContent=descriptions[k];document.querySelectorAll('[data-route]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.route===k))}document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>render(b.dataset.route));render('normal')</script></html>
