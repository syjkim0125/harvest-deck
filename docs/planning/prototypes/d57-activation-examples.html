<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D57 카드 발동 예시</title><style>body{font:16px system-ui;background:#172434;color:#edf3f5;max-width:520px;margin:2rem auto;padding:1rem}svg{width:100%;display:block}button{font:inherit;color:inherit;background:#344a5d;border:1px solid #839bad;border-radius:8px;padding:.7rem;margin:.25rem;cursor:pointer}button[aria-pressed=true]{background:#665187}section{margin:1rem 0;padding:1rem;background:#26394c;border-radius:10px}</style><h1>전술 카드 발동</h1><p>채팅 예시 재구성 · 실제 드래그·시간·전투 구현 아님</p><section><h2>즉시형: 보호막 강화</h2><svg viewBox="0 0 340 180"><rect width="340" height="180" rx="10" fill="#101c2b"/><g id="shield" visibility="hidden"><circle cx="120" cy="110" r="48" fill="#5bcfdb" fill-opacity=".12" stroke="#82dde8" stroke-width="2"/><circle cx="120" cy="110" r="42" fill="none" stroke="#82dde8" stroke-dasharray="5 5"/></g><g transform="translate(120 110) rotate(40)"><path d="M0 -24 L9 -5 L23 17 L0 10 L-23 17 L-9 -5Z" fill="#9cbfd7"/><path d="M-7 13L0 34L7 13" fill="#e5ae72"/></g><g transform="translate(269 36) rotate(220)"><path d="M0 -23L12 3L22 17L0 10L-22 17L-12 3Z" fill="#b9756b"/></g><path d="M236 53l-13 8M212 67l-13 8M188 81l-13 8" stroke="#f0b680" stroke-width="3"/></svg><button id="shieldButton">보호막 강화 카드 사용</button></section><section><h2>조준형: 중력 제어</h2><svg viewBox="0 0 340 202"><rect width="340" height="202" rx="10" fill="#111d2a"/><circle id="range" r="72" fill="#8f6bcc" fill-opacity=".16" stroke="#bda1ea" stroke-width="2" stroke-dasharray="5 4"/><g id="ships"></g><path d="M170 147 L184 179 L170 172 L156 179Z" fill="#c1d5e3"/></svg><p id="status" aria-live="polite"></p><div id="positions"></div><button id="fire">지정한 위치에 발동</button></section><script>let shielding=false;document.getElementById('shieldButton').onclick=()=>{shielding=!shielding;document.getElementById('shield').setAttribute('visibility',shielding?'visible':'hidden');document.getElementById('shieldButton').textContent=shielding?'초기 상태로 돌아가기':'보호막 강화 카드 사용'};const enemies=[[89,64],[136,102],[204,62],[254,113],[274,53]],positions=[[105,83],[183,85],[252,83]],names=['왼쪽','중앙','오른쪽'];let target=1,fired=false;const ns='http://www.w3.org/2000/svg';function render(){let [x,y]=positions[target],count=0;const range=document.getElementById('range');range.setAttribute('cx',x);range.setAttribute('cy',y);range.setAttribute('stroke-dasharray',fired?'0':'5 4');let g=document.getElementById('ships');g.replaceChildren();for(let [a,b] of enemies){let hit=Math.hypot(a-x,b-y)<72;if(hit)count++;if(hit&&fired){a=(a+2*x)/3;b=(b+2*y)/3}let p=document.createElementNS(ns,'path');p.setAttribute('d','M0 15 L-13 -11 L0 -6 L13 -11Z');p.setAttribute('transform','translate('+a+' '+b+')');p.setAttribute('fill','#bd7b71');p.setAttribute('stroke','#e4b3a3');g.append(p)}document.getElementById('status').textContent=fired?'발동 완료: '+count+'기 영향':'범위 내 적 '+count+'기';document.getElementById('fire').textContent=fired?'다시 조준하기':'지정한 위치에 발동';[...document.getElementById('positions').children].forEach((e,i)=>e.setAttribute('aria-pressed',i===target))}names.forEach((n,i)=>{let e=document.createElement('button');e.textContent=n;e.onclick=()=>{target=i;fired=false;render()};document.getElementById('positions').append(e)});document.getElementById('fire').onclick=()=>{fired=!fired;render()};render()</script></html>
