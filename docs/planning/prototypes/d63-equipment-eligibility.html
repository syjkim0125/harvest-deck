<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D63 장비 상실과 카드 사용</title><style>body{font:16px system-ui;background:#172434;color:#edf3f5;max-width:520px;margin:2rem auto;padding:1rem}button{font:inherit;color:inherit;background:#344a5d;border:1px solid #839bad;border-radius:8px;padding:.7rem;cursor:pointer}button[aria-pressed=true]{background:#477664}svg{width:100%;display:block}.buttons{display:flex;gap:8px;flex-wrap:wrap}#desc{background:#26394c;padding:1rem;border-radius:8px}</style><h1>EMP 방출 — 장비 상태와 카드</h1><p>채팅 예시 재구성 · 실제 발동·손실 규칙 아님</p><svg viewBox="0 0 340 155"><rect width="340" height="155" rx="10" fill="#111d2b"/><g transform="translate(96 74)"><path id="ship" d="M0 -47L18 -12L37 30L0 18L-37 30L-18 -12Z" fill="#9dbbcf" stroke="#d2e3ec"/><rect id="module" x="-10" y="-3" width="20" height="31" rx="4" fill="#6e9d9e"/><path id="damage" visibility="hidden" d="M-16 -12L4 4L-9 19L18 27" stroke="#ec9e77" stroke-width="3" fill="none"/></g><rect id="card" x="215" y="19" width="90" height="107" rx="8" fill="#625482" stroke="#b4a5d5"/><text id="symbol" x="260" y="65" font-size="35" text-anchor="middle" fill="#fff">ϟ</text><text x="260" y="91" font-size="12" text-anchor="middle" fill="#dae3eb">EMP 방출</text><text id="availability" x="260" y="111" font-size="10" text-anchor="middle" fill="#b8e0c8">발동 가능</text><text id="equipment" x="96" y="137" font-size="11" text-anchor="middle" fill="#c9d8e2">전자전 장비 장착</text></svg><div class="buttons"><button data-state="normal">정상</button><button data-state="lost">장비 상실</button><button data-state="restored">복구</button></div><p>카드 지식 보존: 유지</p><p>실제 카드 사용: <strong id="usable"></strong></p><p id="desc" aria-live="polite"></p><script>const states={normal:['전자전 장비 장착','현재 장비와 습득한 기술이 연결된 상태.'],lost:['전자전 장비 상실','호환 장비를 다시 확보하면 기술을 사용할 수 있어.'],restored:['호환 장비 재장착','새로운 장비를 확보하여 기존에 습득한 전술을 활용해.']};function render(s){let lost=s==='lost',by=id=>document.getElementById(id);by('ship').setAttribute('fill',lost?'#68717c':'#9dbbcf');by('module').setAttribute('fill',lost?'#775249':'#6e9d9e');by('damage').setAttribute('visibility',lost?'visible':'hidden');by('card').setAttribute('fill',lost?'#394555':'#625482');by('symbol').setAttribute('fill',lost?'#8c9cab':'#fff');by('availability').textContent=lost?'발동 불가':'발동 가능';by('availability').setAttribute('fill',lost?'#dca69c':'#b8e0c8');by('equipment').textContent=states[s][0];by('usable').textContent=lost?'불가':'가능';by('desc').textContent=states[s][1];document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.state===s))}document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>render(b.dataset.state));render('normal')</script></html>
