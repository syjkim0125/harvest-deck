<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D65 덱 편집 예시</title><style>body{font:16px system-ui;background:#172434;color:#edf3f5;max-width:520px;margin:2rem auto;padding:1rem}button{font:inherit;color:inherit;background:#344a5d;border:1px solid #839bad;border-radius:8px;padding:.7rem;cursor:pointer}button[aria-pressed=true]{background:#477664}.buttons{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cards div{background:#625482;border-radius:8px;padding:12px;text-align:center}#ops div{background:#477664}.symbol{font-size:26px;display:block}svg{width:100%;display:block}section{border:1px solid #698197;border-radius:10px;padding:12px;margin:15px 0}</style><h1>D65 덱 편집 예시</h1><p>채팅 예시 재구성 · 실제 카드 수·안전 판정 아님</p><section><h2>목적별 덱 프리셋</h2><div class="buttons"><button data-p="explore">탐험</button><button data-p="hunt">사냥</button><button data-p="trade">교역</button></div><h3 id="name"></h3><p>전술 덱</p><div id="tactical" class="cards"></div><p>운용 덱</p><div id="ops" class="cards"></div></section><section><h2>위험 상태별 편집</h2><div class="buttons"><button data-s="safe">안전 상태</button><button data-s="combat">교전 중</button><button data-s="resolved">교전 종료</button></div><svg viewBox="0 0 340 180"><rect width="340" height="180" rx="10" fill="#111d2b"/><circle cx="13" cy="7" r=".7" fill="#b4c7d9" opacity=".5"/><circle cx="92" cy="50" r=".7" fill="#b4c7d9" opacity=".5"/><circle cx="171" cy="93" r=".7" fill="#b4c7d9" opacity=".5"/><circle cx="250" cy="136" r=".7" fill="#b4c7d9" opacity=".5"/><circle cx="329" cy="1" r=".7" fill="#b4c7d9" opacity=".5"/><circle cx="71" cy="44" r=".7" fill="#b4c7d9" opacity=".5"/><circle cx="150" cy="87" r=".7" fill="#b4c7d9" opacity=".5"/><circle cx="229" cy="130" r=".7" fill="#b4c7d9" opacity=".5"/><circle cx="308" cy="173" r=".7" fill="#b4c7d9" opacity=".5"/><circle cx="50" cy="38" r=".7" fill="#b4c7d9" opacity=".5"/><circle cx=" "/><circle cx="40" cy="76" r=".7" fill="#b4c7d9" opacity=".5"/><circle cx="119" cy="119" r=".7" fill="#b4c7d9" opacity=".5"/><circle cx="198" cy="162" r=".7" fill="#b4c7d9" opacity=".5"/><circle cx="277" cy="27" r=".7" fill="#b4c7d9" opacity=".5"/><circle cx="19" cy="70" r=".7" fill="#b4c7d9" opacity=".5"/><circle cx="98" cy="113" r=".7" fill="#b4c7d9" opacity=".5"/><circle cx="177" cy="156" r=".7" fill="#b4c7d9" opacity=".5"/><g transform="translate(108 105) rotate(45)"><path d="M0 -24L9 -5L23 17L0 10L-23 17L-9 -5Z" fill="#9cbfd7" stroke="#d9e7f0"/><path d="M-7 13L0 34L7 13" fill="#e5ae72"/></g><g id="safe"><circle cx="260" cy="57" r="39" fill="#456b7e"/><ellipse cx="260" cy="57" rx="59" ry="13" stroke="#88a4b1" transform="rotate(-22 260 57)" fill="none"/></g><g id="combat"><path transform="translate(248 45) rotate(220)" d="M0 -17L8 1L16 13L0 8L-16 13L-8 1Z" fill="#b9756b" stroke="#dca89f"/><path transform="translate(275 101) rotate(220)" d="M0 -17L8 1L16 13L0 8L-16 13L-8 1Z" fill="#b9756b" stroke="#dca89f"/><path transform="translate(205 31) rotate(220)" d="M0 -17L8 1L16 13L0 8L-16 13L-8 1Z" fill="#b9756b" stroke="#dca89f"/><path d="M224 61L129 91M252 108L139 110" stroke="#eaa78c" stroke-dasharray="6 6" stroke-width="2"/></g><g id="resolved"><path d="M238 70l16 15-12 17-26-14Z" fill="#64707e"/><path d="M237 72l-8-15m25 30l15-8" stroke="#b38e73" stroke-width="2"/></g><rect x="12" y="12" width="111" height="26" rx="6" fill="#365d4d"/><text id="status" x="67" y="29" font-size="11" text-anchor="middle" fill="#e5f3e8"/></svg><p id="permissions"></p><p id="description" aria-live="polite"></p></section><script>const presets={"explore":{"n":"미지의 행성 탐험","t":[["◎","위험 감지"],["◈","환경 보호"],["↗","긴급 탈출"]],"o":[["◇","심층 탐사"],["✿","생태 교감"],["⚗","유물 분석"]]},"hunt":{"n":"현상금 사냥","t":[["ϟ","EMP 방출"],["⊕","정밀 타격"],["✥","드론 편대"]],"o":[["◎","목표 추적"],["⚙","장비 개조"],["◆","잔해 분석"]]},"trade":{"n":"장거리 교역","t":[["◈","보호막 강화"],["↗","긴급 기동"],["✥","호위 지원"]],"o":[["◆","시장 분석"],["▣","화물 최적화"],["↔","협상"]]}};function preset(k){let p=presets[k];document.getElementById('name').textContent=p.n;for(const [id,key] of [['tactical','t'],['ops','o']])document.getElementById(id).replaceChildren(...p[key].map(([e,n])=>{let d=document.createElement('div'),s=document.createElement('span');s.className='symbol';s.textContent=e;d.append(s,n);return d}));document.querySelectorAll('[data-p]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===k))}const states={safe:['안전한 항행','안전한 상황에서 다음 활동 준비'],combat:['해적 교전 발생','현재 덱과 손패를 활용해 위기 극복. 무제한 덱 교체 불가'],resolved:['교전 종료','안전해지면 거점 귀환 없이 재구성 가능']};function situation(k){for(const s of Object.keys(states))document.getElementById(s).setAttribute('visibility',k===s?'visible':'hidden');document.getElementById('status').textContent=states[k][0];document.getElementById('permissions').textContent='전체 덱 편집·프리셋 변경: '+(k==='combat'?'제한':'가능')+' / 제한 손패 교체 및 기본 조작: 가능';document.getElementById('description').textContent=states[k][1];document.querySelectorAll('[data-s]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===k))}document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>preset(b.dataset.p));document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>situation(b.dataset.s));preset('explore');situation('safe')</script></html>
