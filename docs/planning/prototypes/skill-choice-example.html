<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D34 기술 선택 예시</title><style>body{font:16px/1.5 system-ui,sans-serif;background:#182e35;color:#e3ece3;margin:0}main{max-width:480px;margin:auto;padding:24px}section{border:1px solid #7cae9e;background:#304a49;padding:18px;border-radius:12px;margin:12px 0}small{color:#bdd1ca}label{display:flex;gap:12px;align-items:start;margin:12px 0;padding:12px;border:1px solid #65877e;border-radius:8px}progress{width:100%;accent-color:#79b6a5}h1{font-size:22px}h2{font-size:18px}</style><main><h1>D34 · 기술 습득 예시</h1><small>대화 시안 재구성. 실제 게임 UI 및 밸런스 미확정.</small><section><b>실제 항해와 탐험</b><p>미지의 항성계 탐사 및 신호 발견</p></section><section><b>탐색 숙련도 성장</b><progress value="100" max="100"></progress><small>새로운 기술을 배울 기회 (예시)</small></section><section><h2>탐색 기술 선택 예시</h2><form><label><input type="radio" name="skill" value="scan" checked><span><b>심층 탐지</b><br>숨겨진 신호와 미세한 환경 단서 발견</span></label><label><input type="radio" name="skill" value="bio"><span><b>생태 분석</b><br>생명체의 습성과 서식 환경 파악</span></label><label><input type="radio" name="skill" value="relic"><span><b>고대 기술 판독</b><br>외계 유물과 미지의 장치 조사</span></label></form><small>선택한 성장 방향</small><p id="result" aria-live="polite">미지의 항성계 탐사 전문가</p></section><small>기술 목록·해금 조건·숙련도 수치는 미확정.</small></main><script>const names={scan:"미지의 항성계 탐사 전문가",bio:"외계 생태계 탐험 전문가",relic:"고대 문명 탐사 전문가"};document.querySelector("form").addEventListener("change",e=>{document.getElementById("result").textContent=names[e.target.value]});</script></html>
