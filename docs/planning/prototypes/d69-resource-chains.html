<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D69 자원 생산 흐름</title><style>body{font:16px system-ui;background:#172434;color:#edf3f5;max-width:520px;margin:2rem auto;padding:1rem}button{font:inherit;color:inherit;background:#344a5d;border:1px solid #839bad;border-radius:8px;padding:.7rem;cursor:pointer}button[aria-pressed=true]{background:#477664}.row{display:flex;gap:8px;flex-wrap:wrap}svg{width:100%;display:block;margin:12px 0}</style><h1>자원 생산 흐름</h1><p>채팅 예시 재구성 · 실제 레시피 및 생산 실행 아님</p><div class="row"><button data-chain="0">함선 부품</button><button data-chain="1">의료 제품</button><button data-chain="2">외계 기술</button></div><svg viewBox="0 0 340 365" aria-label="생산 흐름"><rect width="340" height="365" rx="10" fill="#172434"/><g id="nodes"></g></svg><p>모든 제품에 동일한 가공 단계가 필요한 것은 아님.</p><script>const chains=[{"n":"함선 부품","nodes":[["◆","금속 광석","채집·구매"],["▰","합금","제련"],["⚙","함선 부품","가공·조립"],["↗","함선 수리","사용·판매"]],"c":"#426d85"},{"n":"의료 제품","nodes":[["✿","생체 섬유","채집·재배"],["◇","의료 소재","가공"],["✚","치료 키트","제작"],["♡","동료 치료","사용·판매"]],"c":"#477664"},{"n":"외계 기술","nodes":[["✦","중력 결정","탐험·발견"],["⚗","기술 연구","분석"],["⚙","특수 장비","제작"],["◎","중력 제어","전술 활용"]],"c":"#766097"}],ns='http://www.w3.org/2000/svg';function el(tag,attrs,text){let e=document.createElementNS(ns,tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text)e.textContent=text;return e}function render(k){let s=chains[k],g=document.getElementById('nodes');g.replaceChildren();s.nodes.forEach(([e,n,d],i)=>{let y=14+i*87;g.append(el('rect',{x:25,y,width:290,height:68,rx:9,fill:s.c}),el('rect',{x:36,y:y+10,width:48,height:48,rx:7,fill:'#25394b'}),el('text',{x:60,y:y+43,'font-size':27,'text-anchor':'middle',fill:'#fff'},e),el('text',{x:103,y:y+26,'font-size':15,'font-weight':'bold',fill:'#fff'},n),el('text',{x:103,y:y+46,'font-size':11,fill:'#e1e9ee'},d));if(i<3)g.append(el('path',{d:'M170 '+(y+68)+'v15m-5-5l5 5 5-5',stroke:'#c6d8e2','stroke-width':2,fill:'none'}))});document.querySelectorAll('[data-chain]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.chain===k))}document.querySelectorAll('[data-chain]').forEach(b=>b.onclick=()=>render(+b.dataset.chain));render(0)</script></html>
