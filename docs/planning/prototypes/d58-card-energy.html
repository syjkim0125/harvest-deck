<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D58 전술 에너지와 카드 순환 예시</title><style>body{font:16px system-ui;background:#172434;color:#edf3f5;max-width:520px;margin:2rem auto;padding:1rem}button{font:inherit;color:inherit;background:#344a5d;border:1px solid #839bad;border-radius:8px;padding:.7rem;cursor:pointer}button:disabled{opacity:.45;cursor:default}#energy,#hand{display:grid;gap:6px}#energy{grid-template-columns:repeat(6,1fr)}#energy span{height:15px;border-radius:4px;background:#344758}#energy .full{background:#c5a35f}#hand{grid-template-columns:repeat(3,1fr)}.face{min-height:135px;display:grid;gap:6px}.symbol{font-size:30px;padding:12px;border-radius:5px}svg{width:100%;display:block}#log{padding:1rem;background:#26394c;border-radius:8px}.controls{display:grid;gap:8px}</style><h1>전술 에너지 · 카드 순환</h1><p>채팅 예시 재구성 · 실제 전투나 회복 규칙 아님</p><h2 id="count"></h2><div id="energy"></div><svg viewBox="0 0 340 138"><rect width="340" height="138" rx="10" fill="#111d2d"/><g transform="translate(90 92) rotate(48)"><path d="M0 -24L9 -5L23 17L0 10L-23 17L-9 -5Z" fill="#9cbfd7" stroke="#d9e7f0"/><path d="M-7 13L0 34L7 13" fill="#e5ae72"/></g><g fill="#b9756b" stroke="#dca89f"><path transform="translate(251 35) rotate(220)" d="M0 -17L8 1L16 13L0 8L-16 13L-8 1Z"/><path transform="translate(283 83) rotate(220)" d="M0 -17L8 1L16 13L0 8L-16 13L-8 1Z"/><path transform="translate(224 100) rotate(220)" d="M0 -17L8 1L16 13L0 8L-16 13L-8 1Z"/></g><path d="M115 79L222 47" stroke="#8dcaba" stroke-dasharray="4 6" stroke-width="2"/></svg><div id="hand"></div><p id="log" aria-live="polite"></p><div class="controls"><button id="recover">기본 교전 지속 · 에너지 회복</button><button id="reset">다시 시작</button></div><script>const pool=[["약점 탐지","◎",1,"#456e92"],["보호막 강화","◈",2,"#477b76"],["중력 제어","✦",3,"#776097"],["정밀 타격","⊕",2,"#966449"],["긴급 회피","↗",1,"#517694"],["드론 지원","✥",2,"#71638b"]];const initial=()=>({energy:6,hand:[0,1,2],draw:[3,4,5],discard:[],log:'전술 카드를 선택해 봐.'});let g=initial();function play(i){let id=g.hand[i],cost=pool[id][2];if(cost>g.energy)return;g.energy-=cost;g.discard.push(id);if(!g.draw.length){g.draw=g.discard;g.discard=[]}g.hand[i]=g.draw.shift();g.log=pool[id][0]+' 발동 · '+cost+' 에너지 소모';render()}function render(){document.getElementById('count').textContent='전술 에너지 '+g.energy+' / 6';document.getElementById('energy').replaceChildren(...Array.from({length:6},(_,i)=>{let s=document.createElement('span');s.className=i<g.energy?'full':'';return s}));document.getElementById('hand').replaceChildren(...g.hand.map((id,i)=>{let [name,symbol,cost,color]=pool[id],b=document.createElement('button');b.className='face';b.disabled=cost>g.energy;let s=document.createElement('span');s.className='symbol';s.style.background=color;s.textContent=symbol+' '+cost;let n=document.createElement('strong');n.textContent=name;let d=document.createElement('small');d.textContent=b.disabled?'에너지 부족':'발동 가능';b.append(s,n,d);b.onclick=()=>play(i);return b}));document.getElementById('log').textContent=g.log+' · 드로우 '+g.draw.length+'장 · 버림 '+g.discard.length+'장';document.getElementById('recover').disabled=g.energy===6}document.getElementById('recover').onclick=()=>{g.energy=Math.min(6,g.energy+1);g.log='기본 교전 지속 · 에너지 1 회복';render()};document.getElementById('reset').onclick=()=>{g=initial();render()};render()</script></html>
