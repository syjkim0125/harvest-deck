<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D41 관계 반응 예시</title><style>body{margin:0;background:#192e35;color:#e3ece3;font:16px/1.6 system-ui,sans-serif}main{max-width:500px;padding:24px;margin:auto}label{display:block;padding:8px}section{padding:14px;margin:12px 0;background:#30494a;border-radius:10px}small{color:#b7ceca}</style><main><h1>같은 사건, 서로 다른 동료</h1><p>기획 예시 · D41 미승인</p><form><label><input type="radio" name="event" value="risk" checked>위험한 탐험</label><label><input type="radio" name="event" value="upgrade" >함선 개선</label><label><input type="radio" name="event" value="ruin" >새로운 유적</label></form><div id="result" aria-live="polite"></div><small>실제 관계 판정 알고리즘 아님.</small></main><script>const companions=[{"name":"신중한 정비공","role":"안정·기술 연구 중시","reactions":{"risk":["불안","함선 상태가 걱정됩니다. 정비부터 하는 게 어떨까요?"],"upgrade":["만족","이제 훨씬 안정적으로 생활할 수 있겠군요."],"ruin":["기대","새로운 기술을 연구할 좋은 기회입니다."]}},{"name":"모험적인 파일럿","role":"도전·자유 중시","reactions":{"risk":["기대","아무도 가보지 않은 곳이라니! 정말 기대됩니다."],"upgrade":["만족","새 엔진의 성능을 시험해 보고 싶군요."],"ruin":["호기심","이 근처에 다른 항성계로 가는 단서가 있을지도 몰라요."]}},{"name":"소리에 민감한 외계 생명체","role":"안전·조용한 환경 선호","reactions":{"risk":["불안","큰 진동과 소음에 놀라 은신처에 숨는다."],"upgrade":["안정","새롭게 마련된 조용한 공간에서 편하게 잠든다."],"ruin":["호기심","미세한 진동을 감지하고 주변을 탐색한다."]}}];function show(id){document.querySelector("#result").innerHTML=companions.map(c=>"<section><b>"+c.name+"</b><br><small>"+c.role+"</small><p>"+c.reactions[id].join(": ")+"</p></section>").join("")}document.querySelector("form").addEventListener("change",e=>show(e.target.value));show("risk");</script></html>
