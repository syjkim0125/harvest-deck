<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D62 카드 획득 예시</title><style>body{font:16px system-ui;background:#172434;color:#edf3f5;max-width:520px;margin:2rem auto;padding:1rem}button{font:inherit;color:inherit;background:#344a5d;border:1px solid #839bad;border-radius:8px;padding:.7rem;cursor:pointer}button[aria-pressed=true]{outline:3px solid #70ac91}section{border:1px solid #698197;border-radius:12px;padding:1rem;margin:1rem 0}#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{display:grid;align-content:start;gap:7px}.symbol{font-size:30px;padding:10px;border-radius:5px}label{display:block;margin:.8rem 0}progress{width:100%;accent-color:#70ac91}#result{background:#26394c;padding:.8rem;border-radius:8px}</style><h1>카드 획득 예시</h1><p>채팅 예시 재구성 · 실제 보상이나 해금 아님</p><section><h2>외계 유물 연구 성과</h2><div id="cards"></div><p id="result" aria-live="polite">발견한 기술의 활용 방향을 선택해 봐.</p><button id="reset">다시 선택</button></section><section><h2>목표 카드: 드론 편대</h2><p>지원 드론을 전투에 투입하는 전술 능력</p><div id="req"></div><progress id="progress" max="4" value="1"></progress><p id="status" aria-live="polite"></p></section><script>const rewards=[["중력 제어","✦","#766097","전술 카드","특정 범위 내 적의 움직임 제어"],["유물 분석","⚗","#477664","운용 카드","외계 기술 연구의 새로운 선택지"],["환경 보호","◈","#426d85","전술 카드","위험 환경에서 보호 능력 활용"]],requirements=["드론 설계도 확보","드론 운용 기술을 가진 동료 영입","필요한 전자 부품 확보","함선 연구실에서 기술 연구"];let reward=-1,done=[true,false,false,false];function render(){document.getElementById('cards').replaceChildren(...rewards.map(([name,e,color,type,desc],i)=>{let b=document.createElement('button');b.className='card';b.setAttribute('aria-pressed',reward===i);let s=document.createElement('span');s.className='symbol';s.style.background=color;s.textContent=e;let n=document.createElement('strong');n.textContent=name;let d=document.createElement('small');d.textContent=type+' · '+desc;b.append(s,n,d);b.onclick=()=>{reward=i;render()};return b}));document.getElementById('result').textContent=reward<0?'발견한 기술의 활용 방향을 선택해 봐.':rewards[reward][0]+' 선택 · 실제 사용에는 장비나 동료 조건이 적용될 수 있어.';document.getElementById('reset').hidden=reward<0;let count=done.filter(Boolean).length;document.getElementById('progress').value=count;document.getElementById('status').textContent=count+'/4 조건 충족'+(count===4?' · 카드 해금 조건 충족':' · 설명용 진행 상태')}requirements.forEach((r,i)=>{let l=document.createElement('label'),b=document.createElement('input');b.type='checkbox';b.checked=done[i];b.onchange=()=>{done[i]=b.checked;render()};l.append(b,' '+r);document.getElementById('req').append(l)});document.getElementById('reset').onclick=()=>{reward=-1;render()};render()</script></html>
