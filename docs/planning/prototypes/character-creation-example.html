<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOID CARAVAN — D30/D31 대화 시안 재구성</title><style>*{box-sizing:border-box}body{margin:0;background:#172c34;color:#e8eee5;font:16px/1.5 system-ui,sans-serif}main{max-width:480px;margin:auto;padding:24px 18px}header{padding:22px;background:linear-gradient(145deg,#345c64,#263e46);border:1px solid #779b95;border-radius:18px;margin-bottom:16px}h1{font-size:23px;margin:0}h2{font-size:19px}small{color:#c0d3cb}section{border:1px solid #52777b;border-radius:14px;padding:18px;background:#243e47;margin:12px 0}button,select{font:inherit;color:inherit;background:#304f53;border:1px solid #81ad9f;border-radius:9px;padding:11px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.opt{display:block;width:100%;margin:8px 0;text-align:left}.selected{background:#416c62;border-color:#b4dfc7}.nav{display:flex;justify-content:space-between;margin-top:14px}label{display:flex;flex-wrap:wrap;gap:9px;justify-content:space-between;align-items:center;margin:14px 0}select{max-width:100%}.track{height:9px;background:#35484b;border-radius:8px;overflow:hidden;flex:1}.bar{height:100%;background:#96c9b1}.stat{display:flex;align-items:center;gap:13px;margin:11px 0}.stat span{width:40px}a{color:#bee8d3}</style><main><header><small>VOID CARAVAN · 기획 보존용</small><h1>나의 시작 이야기</h1><small>채팅 시안의 재구성 · 최종 게임 UI 아님</small></header><section id="quiz"></section><section id="profile"><h2>추천 시작 프로필</h2><small>미지의 세계를 찾아서 · 독립 선장 (예시)</small><div id="fields"></div><h2>초기 능력 예시</h2><div id="stats"></div><small>게이지는 직업 변경을 설명하기 위한 예시로만 사용. 배경과 함선의 효과 및 실제 수치는 미확정.</small></section><p><small>원본 대화에서 자동 표시된 조종석/인물 이미지는 미확보로 넣지 않았다. 이 시안은 네트워크 없이 실행되는 재구성본이다.</small></p></main><script>const d={"status":"대화 예시 복원 — 추천 알고리즘/능력치/직업/함선은 미확정","questions":[{"q":"항해 중 정체불명의 조난 신호를 발견했다. 당신은?","opts":["위험을 감수하고 구조하러 간다.","주변을 탐색하고 신호를 분석한다.","구조에 필요한 장비를 먼저 준비한다.","다른 함선에 연락해 협력을 요청한다."]},{"q":"미지의 행성에서 가장 먼저 하고 싶은 일은?","opts":["새로운 생명체를 만나고 싶다.","숨겨진 유적을 발견하고 싶다.","희귀한 자원과 기술을 연구하고 싶다.","현지 문명과 교역하고 싶다."]},{"q":"당신에게 함선이란 어떤 존재인가?","opts":["자유롭게 여행하기 위한 수단","새로운 발견을 위한 탐사 기지","나만의 기술과 장비를 발전시키는 공간","동료들과 함께 살아가는 집"]}],"resultLabels":["개척형 탐험가","호기심 많은 수색대원","기술 중심 엔지니어","관계 중심 선장"],"resultRule":"예시 답변 인덱스 최빈값, 동률이면 앞 인덱스. 실제 성향 분석 아님.","profiles":[["자유로운 항해자","민간 수송선 출신","기동·조종","파일럿","소형 고속선","직접 항해하고 미지의 항성계를 발견하는 데 유리"],["호기심 많은 탐험가","행성 조사단 출신","탐지·생태 지식","수색대원","탐사선","숨겨진 장소와 희귀 생명체를 발견하는 데 유리"],["창조적인 기술자","정거장 정비공 출신","수리·제작","엔지니어","다목적 작업선","장비 개조와 외계 기술 연구에 유리"],["생명을 지키는 구조자","민간 구조대 출신","치료·생물 관리","의무관","미제시","동료의 생존과 생명체 구조에 유리"],["사람을 연결하는 협상가","성간 상단 출신","협상·교섭","외교관","미제시","교역과 세력 관계 형성에 유리"]],"editable":{"background":["행성 조사단","민간 수송선","정거장 정비공","민간 구조대","성간 상단"],"job":["파일럿","수색대원","엔지니어","의무관","외교관"],"ship":["소형 고속선","소형 탐사선","다목적 작업선"]},"exampleDefaults":{"background":"행성 조사단","job":"수색대원","ship":"소형 탐사선"},"stats":["조종","탐색","기술","의학","교섭"],"exampleStatRule":"선택한 직업에 대응하는 게이지 85%, 나머지 35%. 화면 시연용 비율, 게임 능력치 공식 아님."};let idx=0,answers={};const quiz=document.getElementById('quiz');function render(){if(idx>=d.questions.length){const a=[0,1,2,3].sort((x,y)=>Object.values(answers).filter(v=>v===y).length-Object.values(answers).filter(v=>v===x).length)[0];quiz.innerHTML='<small>당신의 초기 성향 추천 (예시)</small><h2>'+d.resultLabels[a]+'</h2><p>답변을 바탕으로 초기 성장 방향을 추천하는 예시입니다. 실제 직업과 능력치는 직접 확인하고 변경할 수 있습니다.</p><button id="reset">다시 선택</button>';document.getElementById('reset').onclick=()=>{idx=0;answers={};render()};return}const q=d.questions[idx];quiz.innerHTML='<small>성향 질문 '+(idx+1)+' / '+d.questions.length+'</small><h2>'+q.q+'</h2>'+q.opts.map((o,i)=>'<button class="opt '+(answers[idx]===i?'selected':'')+'" data-i="'+i+'">'+o+'</button>').join('')+'<div class="nav"><button id="prev" '+(idx===0?'disabled':'')+'>이전</button><button id="next" '+(answers[idx]===undefined?'disabled':'')+'>'+(idx===2?'결과 확인':'다음')+'</button></div>';quiz.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{answers[idx]=Number(b.dataset.i);render()});document.getElementById('prev').onclick=()=>{idx--;render()};document.getElementById('next').onclick=()=>{idx++;render()}}const fields=document.getElementById('fields');const names={background:'출신 배경',job:'초기 직업',ship:'초기 함선'};Object.keys(d.editable).forEach(k=>{const l=document.createElement('label');l.textContent=names[k];const s=document.createElement('select');s.id=k;d.editable[k].forEach(v=>s.add(new Option(v,v)));s.value=d.exampleDefaults[k];s.onchange=stats;l.appendChild(s);fields.appendChild(l)});function stats(){const j=d.editable.job.indexOf(document.getElementById('job').value);document.getElementById('stats').innerHTML=d.stats.map((s,i)=>'<div class="stat"><span>'+s+'</span><div class="track"><div class="bar" style="width:'+(i===j?85:35)+'%"></div></div></div>').join('')}render();stats();</script></html>
