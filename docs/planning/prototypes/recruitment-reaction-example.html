<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D39 영입 반응 예시</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#192e35;color:#e3ece3;margin:0}main{max-width:480px;margin:auto;padding:24px}label{display:block;border:1px solid #75988f;border-radius:8px;padding:12px;margin:12px 0}section{background:#30494a;border-radius:12px;padding:18px}small{color:#b7ceca}</style><main><h1>정거장 출신 정비공</h1><p>개인 목표: 새로운 기술 연구와 안정적인 생활</p><form><label><input type="radio" name="condition" value="research" checked> 연구 시설을 갖춘 탐사 함선</label><label><input type="radio" name="condition" value="pirate" > 위험한 전투를 반복하는 해적 함선</label><label><input type="radio" name="condition" value="poor" > 시설이 부족하지만 신뢰가 높은 선장</label></form><section><b>예상 반응</b><p id="result" aria-live="polite">흥미로운 기술을 많이 연구할 수 있겠군요. 함께 가고 싶습니다.</p></section><p><small>대화 인터랙션 재구성. 실제 NPC 영입 판정 알고리즘 아님.</small></p></main><script>const reactions=[{"id":"research","condition":"연구 시설을 갖춘 탐사 함선","response":"흥미로운 기술을 많이 연구할 수 있겠군요. 함께 가고 싶습니다."},{"id":"pirate","condition":"위험한 전투를 반복하는 해적 함선","response":"저는 전투보다는 연구를 하고 싶습니다. 이번 제안은 거절하겠습니다."},{"id":"poor","condition":"시설이 부족하지만 신뢰가 높은 선장","response":"시설은 부족하지만 당신이라면 믿을 수 있을 것 같습니다. 몇 가지 조건을 이야기해 볼까요?"}];document.querySelector("form").addEventListener("change",e=>{document.getElementById("result").textContent=reactions.find(r=>r.id===e.target.value).response});</script></html>
