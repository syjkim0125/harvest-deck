<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D43 동료 배치 예시</title><style>body{margin:0;background:#192e35;color:#e3ece3;font:16px/1.6 system-ui,sans-serif}main{max-width:480px;margin:auto;padding:24px}label{display:block;padding:10px;border:1px solid #75988f;border-radius:8px;margin:8px 0}section{padding:16px;background:#30494a;border-radius:10px}small{color:#b7ceca}</style><main><h1>정거장 출신 정비공</h1><p>함선 정비 · 고대 기술 연구</p><form><label><input type="radio" name="assignment" value="ship" checked> 기함에 배치</label><label><input type="radio" name="assignment" value="planet" > 행성 탐험에 동행</label><label><input type="radio" name="assignment" value="base" > 거점에 배치</label></form><section aria-live="polite"><b>얻는 이점</b><p id="benefit">함선 수리와 장비 개조, 연구 업무를 수행.</p><b>기회비용</b><p id="cost">행성 탐험 중 정비공의 전문 기술을 직접 활용하기 어려움.</p></section><p><small>설명용 재구성. 실제 배치·시설·UI 미확정.</small></p></main><script>const assignments=[{"id":"ship","label":"기함에 배치","benefit":"함선 수리와 장비 개조, 연구 업무를 수행.","cost":"행성 탐험 중 정비공의 전문 기술을 직접 활용하기 어려움."},{"id":"planet","label":"행성 탐험에 동행","benefit":"고대 기계를 복구하거나 특수 장치를 활용해 새로운 탐험 경로를 발견.","cost":"함선에 남아 진행할 정비·연구 업무가 제한됨."},{"id":"base","label":"거점에 배치","benefit":"거점의 생산 시설을 관리하고 기술 발전에 기여.","cost":"함선과 행성 탐험에서 즉시 도움받기 어려움."}];document.querySelector("form").addEventListener("change",e=>{const a=assignments.find(x=>x.id===e.target.value);document.querySelector("#benefit").textContent=a.benefit;document.querySelector("#cost").textContent=a.cost});</script></html>
