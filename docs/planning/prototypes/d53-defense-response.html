<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D53 거점 방어 대응 예시</title><style>body{font:16px system-ui;background:#152334;color:#eef2f6;max-width:520px;margin:2rem auto;padding:1rem}label{display:block;margin:1rem 0}svg{width:100%}#result{background:#304758;padding:1rem;border-radius:12px}</style><h1>채굴 전초기지 긴급 통신</h1><p>이전 채팅 인터랙션 재구성 · 실제 판정 아님</p><svg viewBox="0 0 340 180"><rect width="340" height="180" rx="12" fill="#142131"/><circle cx="100" cy="86" r="58" fill="#765e49" stroke="#aa896a"/><rect x="75" y="69" width="23" height="20" fill="#b8d2d0"/><rect x="105" y="83" width="24" height="23" fill="#d7ba88"/><circle cx="100" cy="86" r="68" stroke="#dcad68" fill="none" stroke-dasharray="5 5"/><path d="M244 32l15 19-15-5-8 10Zm22 27 15 19-15-5-8 10Zm22 27 15 19-15-5-8 10Z" fill="#d17b70"/><path d="M236 85Q202 92 169 87" fill="none" stroke="#dc8b7a" stroke-dasharray="5 4"/><text x="100" y="166" fill="#e0d2b9" text-anchor="middle" font-size="12">채굴 전초기지</text><text x="257" y="138" fill="#e5a094" font-size="11" text-anchor="middle">적대 함대 접근</text></svg><p>인근 해적 함대가 거점으로 접근하고 있습니다.</p><div id="choices"></div><p id="result"></p><script>const choices=[['호위 함대 파견','독립 함대가 방어를 지원하고 다른 임무에 투입할 함대가 줄어든다.'],['기함 직접 방어','직접 방어전에 참여하고 시설과 자원 보존 기회를 얻는다.'],['협상 시도','상대 목적에 따른 거래·휴전 시도.'],['동료와 자원 철수','동료와 중요 자원 보호, 시설 손상이나 점령 위험.'],['현지 방어 인력 위임','경비 인력과 방어 시설 역량에 따른 자율 대응.']];for(let i=0;i<choices.length;i++){const l=document.createElement('label');const input=document.createElement('input');input.type='radio';input.name='response';input.checked=i===0;input.onchange=()=>document.getElementById('result').textContent=choices[i][1];l.append(input,choices[i][0]);document.getElementById('choices').append(l)}document.getElementById('result').textContent=choices[0][1];</script></html>
