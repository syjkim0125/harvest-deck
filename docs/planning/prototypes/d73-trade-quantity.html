<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D73 수량별 교역</title><style>body{font:16px system-ui;background:#172434;color:#edf3f5;max-width:520px;margin:2rem auto;padding:1rem}input,progress{width:100%;accent-color:#719d8a}.line{display:flex;justify-content:space-between;margin:12px 0}section{background:#293b4c;padding:1rem;border-radius:10px}small{color:#beced8}</style><h1>금속 광석 교역</h1><p>광산 행성 → 공업 행성 · 구매 단가 40 CR</p><label>교역 수량 <strong id="count"></strong><input id="q" type="range" min="10" max="30" step="1" value="20"></label><section><div class="line"><span>초기 수요 · 70 CR</span><strong id="n0"></strong></div><progress id="bar0" max="10"></progress><div class="line"><span>추가 수요 · 60 CR</span><strong id="n1"></strong></div><progress id="bar1" max="10"></progress><div class="line"><span>잔여 수요 · 50 CR</span><strong id="n2"></strong></div><progress id="bar2" max="10"></progress></section><div class="line"><span>평균 판매 단가</span><strong id="avg"></strong></div><div class="line"><span>판매 금액</span><strong id="revenue"></strong></div><div class="line"><span>구매 비용</span><strong id="buy"></strong></div><div class="line"><span>운송 비용</span><strong id="ship"></strong></div><div class="line"><span>예상 순이익</span><strong id="profit"></strong></div><small>설명용 재구성. 실제 가격 공식·운송 비용·화폐 단위 아님.</small><script>const by=id=>document.getElementById(id);function render(){let q=+by('q').value,ns=[Math.min(q,10),Math.min(Math.max(q-10,0),10),Math.max(q-20,0)],r=ns[0]*70+ns[1]*60+ns[2]*50;by('count').textContent=q+'개';ns.forEach((n,i)=>{by('n'+i).textContent=n+'개';by('bar'+i).value=n});for(let [k,v] of Object.entries({avg:(r/q).toFixed(1),revenue:r,buy:40*q,ship:100,profit:r-40*q-100}))by(k).textContent=v.toLocaleString()+' CR'}by('q').oninput=render;render()</script></html>
